<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED+ Publicidade — Resumo do negócio</title>
<style>
:root{
  --bg:#F4F4F2; --surface:#FFFFFF; --surface-2:#FAFAF7; --border:#E5E3DD; --line:#EDEBE6;
  --text:#1B1B1B; --muted:#6E7280; --muted-2:#9AA0A6;
  --accent:#1F5FBF; --accent-2:#7A9FD8; --ok:#15A34A; --warn:#E08A0B; --bad:#D6323C; --dead:#D5D3CD;
  --radius:12px; --shadow:0 1px 2px rgba(20,20,20,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15171A; --surface:#1D2024; --surface-2:#23262B; --border:#2E3238; --line:#292D33;
        --text:#ECEDEE; --muted:#9BA1A8; --muted-2:#787F87; --dead:#3A3F46; --shadow:none;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px 60px}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.mesref{font-size:12px;color:var(--muted);margin:0 2px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mesnav{display:flex;align-items:center;gap:4px}
.mesnav b{font-size:13.5px;color:var(--text);font-weight:600;min-width:130px;text-align:center}
.mesbt{background:var(--surface);border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:8px;line-height:1;padding:0}
.mesbt.hoje{width:auto;padding:0 10px;font-size:12.5px;color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;min-height:30px}
.kpi b{font-size:23px;font-weight:600;line-height:1.1;display:block;margin-top:5px;letter-spacing:-.02em}
.kpi em{font-style:normal;display:block;font-size:11.5px;color:var(--muted-2);margin-top:3px}
.kpi.good b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.alert b{color:var(--bad)}

.blockhead{display:flex;align-items:baseline;gap:9px;margin:24px 2px 8px;flex-wrap:wrap}
.blockhead h2{font-size:15px}
.blockhead em{font-style:normal;font-size:12px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setor{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:14px}
.setor-top{height:4px;background:var(--accent)}
.setor.ns .setor-top{background:var(--accent-2)}
.setor-head{padding:15px 18px 13px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.setor-head h2{font-size:18px;letter-spacing:-.01em}
.setor-head p{margin:0 0 0 auto;font-size:12.5px;color:var(--muted)}
.setor-kpis{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.setor-kpis>div{padding:14px 16px;border-right:1px solid var(--line)}
.setor-kpis>div:last-child{border-right:0}
.setor-kpis span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;min-height:28px}
.setor-kpis b{display:block;font-size:22px;font-weight:600;line-height:1.1;margin-top:4px;letter-spacing:-.02em}
.setor-kpis em{font-style:normal;display:block;font-size:11.5px;color:var(--muted-2);margin-top:3px}
.setor-kpis .good b{color:var(--ok)} .setor-kpis .warn b{color:var(--warn)} .setor-kpis .alert b{color:var(--bad)}
.setor-cols{display:grid;grid-template-columns:1fr 1fr}
.setor-cols>div{padding:14px 18px 16px}
.setor-cols>div:first-child{border-right:1px solid var(--line)}
.setor-cols h4{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--muted-2);text-transform:none}
.cidade{padding:16px 16px 14px}
.cidade h3{font-size:15px;display:flex;align-items:baseline;gap:8px}
.cidade h3 em{font-style:normal;font-size:12px;color:var(--muted);margin-left:auto}
.lin{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lin:last-child{border-bottom:0}
.lin b{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
.lin.desp span,.lin.desp b{color:var(--muted)}
.lin.tot{border-top:1px solid var(--border);border-bottom:0;margin-top:4px;padding-top:11px;font-size:15px}
.lin.tot b{font-weight:600;color:var(--ok)}
.lin.tot.neg b{color:var(--bad)}
.barra{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin:10px 0 4px;display:flex}
.barra i{display:block;height:100%}
.legb{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legb i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

.tab{width:100%;border-collapse:collapse;font-size:13.5px}
.tab th{text-align:left;font-weight:500;color:var(--muted-2);font-size:11.5px;padding:10px 14px;border-bottom:1px solid var(--line)}
.tab td{padding:10px 14px;border-bottom:1px solid var(--line)}
.tab tr:last-child td{border-bottom:0}
.tab td.r,.tab th.r{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;border:1px solid var(--border);border-radius:20px;padding:2px 9px;color:var(--muted)}
.tag.on{color:var(--ok);border-color:#BFE3CB} .tag.off{color:var(--warn);border-color:#F0D6A2}
.mini-bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.mini-bar i{display:block;height:100%;background:var(--accent)}
.evo{display:flex;align-items:flex-end;gap:14px;padding:18px 16px 10px;min-height:150px}
.evocol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.evobars{display:flex;align-items:flex-end;gap:3px;height:110px}
.evobars i{width:16px;border-radius:3px 3px 0 0;display:block}
.evolab{font-size:11.5px;color:var(--muted)}
.empty{padding:16px;color:var(--muted);font-size:13px}
.linklin{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);
  font-size:13.5px;color:var(--text);text-decoration:none}
.linklin:last-child{border-bottom:0}
a.linklin:hover{background:var(--surface-2);color:var(--accent)}
.linklin em{font-style:normal;font-size:12px;color:var(--muted-2)}
.linklin b{margin-left:auto;color:var(--accent);font-weight:400}
.linklin.vazio{color:var(--muted-2)}
.aviso{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;
  font-size:12.5px;color:var(--muted);margin-top:20px}
.rodape{text-align:center;font-size:12px;color:var(--muted-2);margin-top:26px}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .duas{grid-template-columns:1fr}
  .setor-kpis{grid-template-columns:repeat(2,1fr)}
  .setor-kpis>div:nth-child(2){border-right:0}
  .setor-kpis>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .setor-cols{grid-template-columns:1fr}
  .setor-cols>div:first-child{border-right:0;border-bottom:1px solid var(--line)}
  .setor-head p{margin-left:0;width:100%}
  .evobars i{width:11px}
}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">LED<span>+</span> Publicidade<small>Resumo do negócio</small></div>
    <div id="atualizado" style="font-size:12px;color:var(--muted)"></div>
  </div>
  <div class="mesref" id="mesref"></div>
  <div id="tela"><div class="empty">Carregando os dados…</div></div>
  <div class="rodape">Não se gerencia o que não se conhece.</div>
</div>

<script>
const SUPABASE_URL = 'https://oxqrrebomtdzecxsfpip.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1sohqR4OnESmTng3VL727w_Prvp8Zj4';
const DIVISAO = { 'OLINDINA': [['Ramon', 50], ['Anai', 50]], 'NOVA SOURE': [['Ramon', 75], ['Anai', 25]] };
const CIDADES = ['OLINDINA', 'NOVA SOURE'];

/* Links de conferência exibidos no fim da página.
   Cole o endereço de cada um entre as aspas; os que ficarem vazios aparecem
   como pendentes e não viram link. */
const LINKS = [
  { nome: 'Extrato da conta', url: 'https://drive.google.com/drive/folders/1KqT4oXvWbkZFBTLRXiSx3H1xccimNN7v', obs: 'pasta no Drive' },
  { nome: 'Comprovante despesas', url: 'https://drive.google.com/drive/folders/1MXNRM7NOoR0G4g3b9wDkX9nwG9kHvEFg', obs: 'pasta no Drive' }
];

const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const money = v => 'R$ ' + (v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const moneyC = v => 'R$ ' + Math.round(v || 0).toLocaleString('pt-BR');
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const MESESL = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const mesNome = r => MESES[+r.slice(5, 7) - 1] + '/' + r.slice(2, 4);
const cidadeNome = c => c === 'NOVA SOURE' ? 'Nova Soure' : 'Olindina';
const br = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '—';
const hojeIso = new Date().toISOString().slice(0, 10);
const mesHoje = hojeIso.slice(0, 7);
let mesRef = mesHoje, DB = null;
function somaMes(ref, n) {
  let [y, m] = ref.split('-').map(Number);
  m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
  return `${y}-${String(m).padStart(2, '0')}`;
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

/* ---------- dados ---------- */
async function carregar() {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/led_estado?id=eq.1&select=dados,atualizado_em`,
    { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } });
  if (!r.ok) throw new Error('Supabase respondeu ' + r.status);
  const j = await r.json();
  if (!j[0] || !j[0].dados || !j[0].dados.clientes) throw new Error('A base ainda está vazia');
  DB = j[0].dados;
  DB.despesas = DB.despesas || []; DB.atrasados = DB.atrasados || []; DB.prospects = DB.prospects || [];
  DB.clientes.forEach(c => { if (!c.entrada) c.entrada = '2026-08'; });
  if (j[0].atualizado_em) {
    const d = new Date(j[0].atualizado_em);
    $('#atualizado').textContent = 'Atualizado em ' + d.toLocaleDateString('pt-BR') + ' às ' +
      d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
}

/* ---------- cálculos ---------- */
const ativoNoMes = (c, ref) => (c.entrada || '0000-00') <= ref && (!c.saida || c.saida >= ref);
const clientesDe = (cid, ref) => DB.clientes.filter(c => c.conta === cid && ativoNoMes(c, ref) && c.tipo !== 'cortesia');
const evsMes = (tipo, ref, cid) => DB.eventos.filter(e => e.tipo === tipo &&
  (tipo === 'pagamento' ? (e.ref || e.data.slice(0, 7)) : e.data.slice(0, 7)) === ref &&
  (!cid || DB.clientes.some(c => c.id === e.cli && c.conta === cid)));

function resumoCidade(cid, ref) {
  const cs = clientesDe(cid, ref);
  const recebido = evsMes('pagamento', ref, cid).reduce((s, e) => s + (e.valor || 0), 0);
  const atrRec = DB.atrasados.filter(a => a.cidade === cid)
    .reduce((t, a) => t + (a.recebidos || []).filter(r => r.data.slice(0, 7) === ref).reduce((x, r) => x + r.valor, 0), 0);
  const desp = DB.despesas.filter(d => d.cidade === cid && d.ref === ref);
  const totDesp = desp.reduce((t, d) => t + d.valor, 0);
  const contratada = cs.reduce((s, c) => s + (c.valor || 0), 0);
  const pagos = cs.filter(c => DB.eventos.some(e => e.cli === c.id && e.tipo === 'pagamento' && (e.ref || e.data.slice(0, 7)) === ref));
  return {
    cid, cs, recebido, atrRec, desp, totDesp, contratada, pagos,
    receita: recebido + atrRec, saldo: recebido + atrRec - totDesp,
    cortesias: DB.clientes.filter(c => c.conta === cid && ativoNoMes(c, ref) && c.tipo === 'cortesia').length,
    devendo: DB.atrasados.filter(a => a.cidade === cid && a.saldo > 0),
    trocas: evsMes('arte', ref, cid).length,
    exclus: evsMes('exclusividade', ref, cid).length
  };
}

/* ---------- render ---------- */
function render() {
  const mr = $('#mesref'); mr.innerHTML = '';
  const nav = el('div', 'mesnav');
  const ant = el('button', 'mesbt', '‹'); ant.onclick = () => { mesRef = somaMes(mesRef, -1); render(); };
  const prox = el('button', 'mesbt', '›'); prox.onclick = () => { mesRef = somaMes(mesRef, 1); render(); };
  nav.append(ant, el('b', '', MESESL[+mesRef.slice(5, 7) - 1] + ' de ' + mesRef.slice(0, 4)), prox);
  if (mesRef !== mesHoje) {
    const v = el('button', 'mesbt hoje', 'Voltar ao mês atual');
    v.onclick = () => { mesRef = mesHoje; render(); };
    nav.appendChild(v);
  }
  mr.appendChild(nav);

  const tela = $('#tela'); tela.innerHTML = '';
  const R = CIDADES.map(c => resumoCidade(c, mesRef));

  /* ---- cada cidade num card só ---- */
  R.forEach(r => {
    const card = el('div', 'setor' + (r.cid === 'NOVA SOURE' ? ' ns' : ''));
    card.appendChild(el('div', 'setor-top'));

    const head = el('div', 'setor-head');
    head.appendChild(el('h2', '', cidadeNome(r.cid)));
    head.appendChild(el('p', '', r.cs.length + ' clientes' + (r.cortesias ? ' · ' + r.cortesias + ' cortesias' : '') +
      ' · rateio ' + (DIVISAO[r.cid] || []).map(([q, p]) => p + '% ' + q).join(' / ')));
    card.appendChild(head);

    const kp = el('div', 'setor-kpis');
    [
      ['Receita do mês', moneyC(r.receita), '', 'mensalidades ' + moneyC(r.recebido) + (r.atrRec ? ' · atrasados ' + moneyC(r.atrRec) : '')],
      ['Despesas do mês', moneyC(r.totDesp), '', r.receita ? pct(r.totDesp, r.receita) + '% da receita' : 'sem receita no mês'],
      ['Saldo do mês', (r.saldo < 0 ? '−' : '') + moneyC(Math.abs(r.saldo)), r.saldo < 0 ? 'alert' : 'good',
        r.receita ? 'margem de ' + pct(r.saldo, r.receita) + '%' : ''],
      ['Recebimento da carteira', pct(r.recebido, r.contratada) + '%', pct(r.recebido, r.contratada) < 70 ? 'warn' : 'good',
        r.pagos.length + ' de ' + r.cs.length + ' · contratado ' + moneyC(r.contratada)]
    ].forEach(([lab, val, cls, sub]) => {
      const d = el('div', cls);
      d.appendChild(el('span', '', lab));
      d.appendChild(el('b', '', String(val)));
      if (sub) d.appendChild(el('em', '', sub));
      kp.appendChild(d);
    });
    card.appendChild(kp);

    const cols = el('div', 'setor-cols');

    const c1 = el('div');
    c1.appendChild(el('h4', '', 'Composição do mês'));
    c1.appendChild(linha('Mensalidades recebidas', moneyC(r.recebido)));
    c1.appendChild(linha('Recebido de atrasados', moneyC(r.atrRec)));
    r.desp.slice().sort((a, b) => (a.data || '').localeCompare(b.data || ''))
      .forEach(d => c1.appendChild(linha((d.data ? br(d.data) + '  ' : '') + d.nome, '− ' + moneyC(d.valor), 'desp')));
    if (!r.desp.length) c1.appendChild(linha('Sem despesas lançadas', '—', 'desp'));
    c1.appendChild(linha('Saldo', (r.saldo < 0 ? '− ' : '') + moneyC(Math.abs(r.saldo)), r.saldo < 0 ? 'tot neg' : 'tot'));
    cols.appendChild(c1);

    const c2 = el('div');
    c2.appendChild(el('h4', '', 'Rateio de ' + cidadeNome(r.cid) + ' · ' + mesNome(mesRef)));
    (DIVISAO[r.cid] || []).forEach(([q, p]) =>
      c2.appendChild(linha(`${q} — ${p}%`, (r.saldo < 0 ? '− ' : '') + moneyC(Math.abs(r.saldo) * p / 100),
        r.saldo < 0 ? 'tot neg' : 'tot')));
    c2.appendChild(linha(r.saldo < 0 ? 'Prejuízo dividido na mesma proporção' : 'Calculado só sobre o resultado desta cidade', '', 'desp'));
    c2.appendChild(linha('Em cobrança nesta cidade',
      moneyC(r.devendo.reduce((s2, a) => s2 + a.saldo, 0)) + ' · ' + r.devendo.length + ' devedores', 'desp'));
    c2.appendChild(linha('Entregas no mês', r.trocas + ' trocas · ' + r.exclus + ' exclusividades', 'desp'));
    cols.appendChild(c2);

    card.appendChild(cols);
    tela.appendChild(card);
  });

  /* ---- quem pagou e quem não pagou ---- */
  tela.appendChild(cab('Pagamentos de ' + mesNome(mesRef), 'cliente a cliente, por cidade'));
  R.forEach(r => {
    const pagosIds = new Set(r.pagos.map(c => c.id));
    const naoPagaram = r.cs.filter(c => !pagosIds.has(c.id));
    const card = el('div', 'setor' + (r.cid === 'NOVA SOURE' ? ' ns' : ''));
    card.appendChild(el('div', 'setor-top'));
    const head = el('div', 'setor-head');
    head.appendChild(el('h2', '', cidadeNome(r.cid)));
    head.appendChild(el('p', '', r.pagos.length + ' pagaram · ' + naoPagaram.length + ' em aberto'));
    card.appendChild(head);
    const cols = el('div', 'setor-cols');

    const c1 = el('div');
    c1.appendChild(el('h4', '', 'Pagaram — ' + moneyC(r.recebido)));
    if (!r.pagos.length) c1.appendChild(linha('Ninguém pagou neste mês', '', 'desp'));
    r.pagos.slice().sort((a, b) => a.empresa.localeCompare(b.empresa, 'pt-BR')).forEach(c => {
      const ev = DB.eventos.filter(e => e.cli === c.id && e.tipo === 'pagamento' &&
        (e.ref || e.data.slice(0, 7)) === mesRef).sort((a, b) => b.data.localeCompare(a.data))[0];
      const l = el('div', 'lin');
      l.appendChild(el('span', '', c.empresa));
      l.appendChild(el('span', 'tag on', ev && ev.data ? br(ev.data) : 'pago'));
      l.appendChild(el('b', '', moneyC(ev ? ev.valor : 0)));
      c1.appendChild(l);
    });
    cols.appendChild(c1);

    const c2 = el('div');
    const falta = naoPagaram.reduce((s2, c) => s2 + (c.valor || 0), 0);
    c2.appendChild(el('h4', '', 'Não pagaram — ' + moneyC(falta)));
    if (!naoPagaram.length) c2.appendChild(linha('Todos em dia neste mês', '', 'desp'));
    naoPagaram.sort((a, b) => (b.valor || 0) - (a.valor || 0)).forEach(c => {
      const l = el('div', 'lin');
      l.appendChild(el('span', '', c.empresa));
      if (c.diaVenc) l.appendChild(el('span', 'tag off', 'vence dia ' + c.diaVenc));
      l.appendChild(el('b', '', c.valor ? moneyC(c.valor) : 'sem valor'));
      c2.appendChild(l);
    });
    cols.appendChild(c2);
    card.appendChild(cols);
    tela.appendChild(card);
  });

  /* ---- evolução, uma cidade por bloco ---- */
  const meses = []; for (let k = 5; k >= 0; k--) meses.push(somaMes(mesRef, -k));
  tela.appendChild(cab('Evolução dos últimos 6 meses', 'saldo mês a mês, cada cidade por si'));
  const evg = el('div', 'duas');
  CIDADES.forEach((cid, ci) => {
    const vals = meses.map(m => resumoCidade(cid, m).saldo);
    const maxv = Math.max(1, ...vals.map(Math.abs));
    const bx = el('div', 'box cidade');
    const h = el('h3', '', cidadeNome(cid));
    h.appendChild(el('em', '', 'melhor ' + moneyC(Math.max(...vals))));
    bx.appendChild(h);
    const linhaEv = el('div', 'evo'); linhaEv.style.padding = '10px 0 0';
    meses.forEach((m, k) => {
      const col = el('div', 'evocol');
      const bars = el('div', 'evobars');
      const i = el('i');
      i.style.height = Math.max(2, Math.abs(vals[k]) / maxv * 105) + 'px';
      i.style.width = '26px';
      i.style.background = vals[k] < 0 ? 'var(--bad)' : (ci === 0 ? 'var(--accent)' : 'var(--accent-2)');
      i.title = mesNome(m) + ' · ' + moneyC(vals[k]);
      bars.appendChild(i); col.appendChild(bars);
      col.appendChild(el('div', 'evolab', mesNome(m)));
      linhaEv.appendChild(col);
    });
    bx.appendChild(linhaEv);
    evg.appendChild(bx);
  });
  tela.appendChild(evg);

  /* ---- inadimplência separada ---- */
  tela.appendChild(cab('Inadimplência', 'cobranças de meses anteriores'));
  const ing = el('div', 'duas');
  CIDADES.forEach(cid => {
    const dev = DB.atrasados.filter(a => a.cidade === cid && a.saldo > 0).sort((a, b) => b.saldo - a.saldo);
    const tot = dev.reduce((s2, a) => s2 + a.saldo, 0);
    const noAr = dev.filter(a => (a.status || '').toLowerCase() === 'online').length;
    const bx = el('div', 'box cidade');
    const h = el('h3', '', cidadeNome(cid));
    h.appendChild(el('em', '', moneyC(tot) + ' · ' + dev.length + ' devedores'));
    bx.appendChild(h);
    if (!dev.length) bx.appendChild(el('div', 'lin desp', 'Nenhum devedor em aberto.'));
    dev.forEach(a => {
      const l = el('div', 'lin');
      const on = (a.status || '').toLowerCase() === 'online';
      const nm = el('span', '', a.nome);
      l.appendChild(nm);
      l.appendChild(el('span', 'tag ' + (on ? 'on' : 'off'), on ? 'no ar' : 'pausado'));
      l.appendChild(el('b', '', moneyC(a.saldo)));
      bx.appendChild(l);
    });
    if (dev.length) bx.appendChild(linha('Total em aberto', moneyC(tot), 'tot'));
    bx.appendChild(linha('Ainda no ar devendo', noAr + ' de ' + dev.length, 'desp'));
    ing.appendChild(bx);
  });
  tela.appendChild(ing);

  /* ---- operação ---- */
  tela.appendChild(cab('Operação do mês', 'entrega e relacionamento, por cidade'));
  const op = el('div', 'box');
  const to = el('table', 'tab');
  to.innerHTML = '<tr><th>Cidade</th><th class="r">Anúncios trocados</th><th class="r">Exclusividades</th><th class="r">Contatos</th></tr>';
  R.forEach(r => {
    const tr = el('tr');
    tr.appendChild(el('td', '', cidadeNome(r.cid)));
    tr.appendChild(el('td', 'r', r.trocas + ' de ' + r.cs.length + ' (' + pct(r.trocas, r.cs.length) + '%)'));
    tr.appendChild(el('td', 'r', String(r.exclus)));
    tr.appendChild(el('td', 'r', String(evsMes('contato', mesRef, r.cid).length)));
    to.appendChild(tr);
  });
  op.appendChild(to); tela.appendChild(op);

  /* ---- links de conferência ---- */
  tela.appendChild(cab('Links para conferência', 'confronte estes números com as fontes originais'));
  const lk = el('div', 'box');
  LINKS.forEach(l => {
    if (l.url) {
      const a = el('a', 'linklin');
      a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
      a.appendChild(el('span', '', l.nome));
      if (l.obs) a.appendChild(el('em', '', l.obs));
      a.appendChild(el('b', '', '↗'));
      lk.appendChild(a);
    } else {
      const d = el('div', 'linklin vazio');
      d.appendChild(el('span', '', l.nome));
      d.appendChild(el('em', '', 'endereço ainda não cadastrado'));
      lk.appendChild(d);
    }
  });
  tela.appendChild(lk);

  tela.appendChild(el('div', 'aviso', 'Cada cidade é fechada por si: receita, despesa, saldo e rateio nunca se misturam. ' +
    'Olindina divide 50% para cada sócio; Nova Soure divide 75% Ramon e 25% Anai. ' +
    'Prospecção em aberto: ' + DB.prospects.length + ' contatos (lista única, sem separação por cidade). ' +
    'Página só de leitura — mostra o que foi lançado na gestão da carteira.'));
}

function kpi(dados) {
  const k = el('div', 'kpis');
  dados.forEach(([lab, val, cls, sub]) => {
    const d = el('div', 'kpi ' + (cls || ''));
    d.appendChild(el('span', '', lab));
    d.appendChild(el('b', '', String(val)));
    if (sub) d.appendChild(el('em', '', sub));
    k.appendChild(d);
  });
  return k;
}
function cab(titulo, sub) {
  const b = el('div', 'blockhead'); b.appendChild(el('h2', '', titulo));
  if (sub) b.appendChild(el('em', '', sub));
  return b;
}
function linha(rot, val, cls) {
  const l = el('div', 'lin ' + (cls || ''));
  l.appendChild(el('span', '', rot)); l.appendChild(el('b', '', val));
  return l;
}

carregar().then(render).catch(e => {
  $('#tela').innerHTML = '<div class="box empty">Não consegui carregar os dados (' + e.message +
    '). Confira se a página de gestão já gravou no Supabase.</div>';
});
</script>
