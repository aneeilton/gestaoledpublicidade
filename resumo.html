<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED+ Publicidade — Resumo do negócio</title>
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F8F9FB; --surface-3:#F1F3F6;
  --border:#E3E6EC; --line:#EDEFF3;
  --text:#12141A; --muted:#646B7A; --muted-2:#9AA1AF;
  --accent:#2457C5; --accent-2:#6D9BEA; --accent-soft:#EAF0FD; --accent-ink:#1B44A0;
  --ok:#0F9D58; --ok-soft:#E8F6EE; --warn:#C97A09; --warn-soft:#FDF3E3;
  --bad:#D23B45; --bad-soft:#FDECEE;
  --r-lg:16px; --r-md:12px;
  --sh-1:0 1px 2px rgba(18,20,26,.06);
  --sh-2:0 2px 8px rgba(18,20,26,.07), 0 1px 2px rgba(18,20,26,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1115; --surface:#171A20; --surface-2:#1D2128; --surface-3:#232831; --border:#2A2F39; --line:#232831;
    --text:#ECEEF2; --muted:#9AA2B1; --muted-2:#6E7684; --accent:#5B8DEF; --accent-2:#3E6AB8; --accent-soft:#1A2438;
    --accent-ink:#9DBBF7; --ok:#3FCB84; --ok-soft:#14291F; --warn:#E9A93C; --warn-soft:#2A2216;
    --bad:#F2707A; --bad-soft:#2B181B; --sh-1:none; --sh-2:0 2px 10px rgba(0,0,0,.35);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.012em}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 60px}

.appbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border)}
@media (prefers-color-scheme:dark){.appbar{background:rgba(23,26,32,.86)}}
.appbar-in{max-width:1120px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--accent),#123A96);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;
  box-shadow:0 2px 8px rgba(36,87,197,.32)}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:15.5px;font-weight:650}
.brand small{font-size:12px;color:var(--muted)}
#atualizado{margin-left:auto;font-size:12px;color:var(--muted);background:var(--surface-3);border-radius:20px;
  padding:6px 12px;white-space:nowrap}

.mesref{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 2px;font-size:12.5px;color:var(--muted)}
.mesnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:4px;box-shadow:var(--sh-1)}
.mesnav b{font-size:13.5px;font-weight:600;color:var(--text);min-width:132px;text-align:center}
.mesbt{background:none;border:0;color:var(--muted);width:30px;height:30px;border-radius:9px;padding:0;font-size:17px;
  display:flex;align-items:center;justify-content:center}
.mesbt:hover{background:var(--surface-3);color:var(--text)}
.mesbt.hoje{width:auto;padding:0 12px;font-size:12.5px;color:var(--accent);font-weight:550}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:8px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 15px;box-shadow:var(--sh-1)}
.kpi span{display:block;font-size:11.5px;color:var(--muted);min-height:31px;font-weight:500;line-height:1.35}
.kpi b{display:block;font-size:24px;font-weight:680;line-height:1.05;margin-top:6px;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;display:block;font-size:11.5px;color:var(--muted-2);margin-top:4px}
.kpi.good b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.alert b{color:var(--bad)}

.blockhead{display:flex;align-items:center;gap:10px;margin:28px 2px 10px;flex-wrap:wrap}
.blockhead h2{font-size:16px}
.blockhead em{font-style:normal;font-size:12.5px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cidade{padding:16px}
.cidade h3{font-size:15px;display:flex;align-items:baseline;gap:8px}
.cidade h3 em{font-style:normal;font-size:12px;color:var(--muted);margin-left:auto}

.setor{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-2);
  overflow:hidden;margin-bottom:16px}
.setor-top{height:4px;background:var(--accent)}
.setor.ns .setor-top{background:var(--accent-2)}
.setor-head{padding:16px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.setor-head h2{font-size:19px;letter-spacing:-.02em}
.setor-head p{margin:0 0 0 auto;font-size:12.5px;color:var(--muted)}
.setor-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.setor-kpis>div{padding:15px 18px;border-right:1px solid var(--line)}
.setor-kpis>div:last-child{border-right:0}
.setor-kpis span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;min-height:28px;font-weight:500}
.setor-kpis b{display:block;font-size:23px;font-weight:680;line-height:1.05;margin-top:5px;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.setor-kpis em{font-style:normal;display:block;font-size:11.5px;color:var(--muted-2);margin-top:4px}
.setor-kpis .good b{color:var(--ok)} .setor-kpis .warn b{color:var(--warn)} .setor-kpis .alert b{color:var(--bad)}
.setor-cols{display:grid;grid-template-columns:1fr 1fr}
.setor-cols>div{padding:16px 20px 18px}
.setor-cols>div:first-child{border-right:1px solid var(--line)}
.setor-cols h4{margin:0 0 8px;font-size:11.5px;font-weight:600;color:var(--muted-2);text-transform:uppercase;
  letter-spacing:.06em}

.lin{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lin:last-child{border-bottom:0}
.lin b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.lin.desp span,.lin.desp b{color:var(--muted);font-weight:500}
.lin.tot{border-top:1px solid var(--border);border-bottom:0;margin-top:6px;padding-top:12px;font-size:15.5px}
.lin.tot b{font-weight:700;color:var(--ok)}
.lin.tot.neg b{color:var(--bad)}

.tab{width:100%;border-collapse:collapse;font-size:13.5px}
.tab th{text-align:left;font-weight:600;color:var(--muted-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  padding:12px 16px;border-bottom:1px solid var(--line)}
.tab td{padding:12px 16px;border-bottom:1px solid var(--line)}
.tab tr:last-child td{border-bottom:0}
.tab td.r,.tab th.r{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;border-radius:20px;padding:3px 10px;color:var(--muted);background:var(--surface-3);font-weight:550}
.tag.on{color:var(--ok);background:var(--ok-soft)} .tag.off{color:var(--warn);background:var(--warn-soft)}
.mini-bar{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.mini-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}







.empty{padding:18px;color:var(--muted);font-size:13.5px}







.aviso{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;
  font-size:12.5px;color:var(--muted);margin-top:22px;line-height:1.6}
.rodape{text-align:center;font-size:12px;color:var(--muted-2);margin-top:30px}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .duas{grid-template-columns:1fr}
  .setor-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .setor-kpis>div:nth-child(2){border-right:0}
  .setor-kpis>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .setor-cols{grid-template-columns:1fr}
  .setor-cols>div:first-child{border-right:0;border-bottom:1px solid var(--line)}
  .setor-head p{margin-left:0;width:100%}
  .appbar-in{height:58px}
}
</style>

<header class="appbar">
  <div class="appbar-in">
    <div class="logo">L+</div>
    <div class="brand"><b>LED+ Publicidade</b><small>Resumo do negócio</small></div>
    <div id="atualizado"></div>
  </div>
</header>

<div class="wrap">
  <div class="mesref" id="mesref"></div>
  <div id="tela"><div class="empty">Carregando os dados…</div></div>
  <div class="rodape">Não se gerencia o que não se conhece.</div>
</div>

<script>
const SUPABASE_URL = 'https://wpviywngfxfwydxzdtos.supabase.co';
const SUPABASE_KEY = 'sb_publishable_IUPLIgkuW_JOTJIWGqdu5g_9jxiyh5W';
const DIVISAO = { 'OLINDINA': [['Ramon', 50], ['Anai', 50]], 'NOVA SOURE': [['Ramon', 75], ['Anai', 25]] };
const CIDADES = ['OLINDINA', 'NOVA SOURE'];


const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const money = v => 'R$ ' + (v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const moneyC = v => 'R$ ' + Math.round(v || 0).toLocaleString('pt-BR');
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const MESESL = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const mesNome = r => MESES[+r.slice(5, 7) - 1] + '/' + r.slice(2, 4);
const cidadeNome = c => c === 'NOVA SOURE' ? 'Nova Soure' : 'Olindina';
const br = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '—';
const hojeIso = new Date().toISOString().slice(0, 10);
const mesHoje = hojeIso.slice(0, 7);
let mesRef = mesHoje, DB = null;
function somaMes(ref, n) {
  let [y, m] = ref.split('-').map(Number);
  m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
  return `${y}-${String(m).padStart(2, '0')}`;
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

/* ---------- dados ---------- */
async function carregar() {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/led_estado?id=eq.1&select=dados,atualizado_em`,
    { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } });
  if (!r.ok) throw new Error('Supabase respondeu ' + r.status);
  const j = await r.json();
  if (!j[0] || !j[0].dados || !j[0].dados.clientes) throw new Error('A base ainda está vazia');
  DB = j[0].dados;
  DB.despesas = DB.despesas || []; DB.atrasados = DB.atrasados || []; DB.prospects = DB.prospects || [];
  DB.clientes.forEach(c => { if (!c.entrada) c.entrada = '2026-08'; });
  if (j[0].atualizado_em) {
    const d = new Date(j[0].atualizado_em);
    $('#atualizado').textContent = 'Atualizado em ' + d.toLocaleDateString('pt-BR') + ' às ' +
      d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
}

/* ---------- cálculos ---------- */
const ativoNoMes = (c, ref) => (c.entrada || '0000-00') <= ref && (!c.saida || c.saida >= ref);
const clientesDe = (cid, ref) => DB.clientes.filter(c => c.conta === cid && ativoNoMes(c, ref) && c.tipo !== 'cortesia');
function recebimentosDoMes(ref, cid) {
  const out = [];
  DB.eventos.filter(e => e.tipo === 'pagamento' && e.data.slice(0, 7) === ref).forEach(e => {
    const c = DB.clientes.find(x => x.id === e.cli);
    if (!c || (cid && c.conta !== cid)) return;
    const comp = e.ref || e.data.slice(0, 7);
    out.push({ nome: c.empresa, valor: e.valor || 0, data: e.data, comp, atraso: comp < ref });
  });
  DB.atrasados.forEach(a => {
    if (cid && a.cidade !== cid) return;
    (a.recebidos || []).filter(r => r.data.slice(0, 7) === ref).forEach(r =>
      out.push({ nome: a.nome, valor: r.valor, data: r.data, comp: null, atraso: true }));
  });
  return out.sort((x, y) => y.data.localeCompare(x.data));
}
const evsMes = (tipo, ref, cid) => DB.eventos.filter(e => e.tipo === tipo &&
  (tipo === 'pagamento' ? (e.ref || e.data.slice(0, 7)) : e.data.slice(0, 7)) === ref &&
  (!cid || DB.clientes.some(c => c.id === e.cli && c.conta === cid)));

function resumoCidade(cid, ref) {
  const cs = clientesDe(cid, ref);
  const caixa = recebimentosDoMes(ref, cid);
  const recebido = caixa.filter(x => !x.atraso).reduce((s, x) => s + x.valor, 0);
  const quitacoes = caixa.filter(x => x.atraso);
  const atrRec = quitacoes.reduce((s, x) => s + x.valor, 0);
  const desp = DB.despesas.filter(d => d.cidade === cid && d.ref === ref);
  const totDesp = desp.reduce((t, d) => t + d.valor, 0);
  const contratada = cs.reduce((s, c) => s + (c.valor || 0), 0);
  const pagos = cs.filter(c => DB.eventos.some(e => e.cli === c.id && e.tipo === 'pagamento' && (e.ref || e.data.slice(0, 7)) === ref));
  const dispensados = cs.filter(c => DB.eventos.some(e => e.cli === c.id && e.tipo === 'ajuste' && (e.ref || '') === ref));
  return {
    cid, cs, recebido, atrRec, quitacoes, desp, totDesp, contratada, pagos, dispensados,
    receita: recebido + atrRec, saldo: recebido + atrRec - totDesp,
    cortesias: DB.clientes.filter(c => c.conta === cid && ativoNoMes(c, ref) && c.tipo === 'cortesia').length,
    devendo: DB.atrasados.filter(a => a.cidade === cid && a.saldo > 0),
    trocas: evsMes('arte', ref, cid).length,
    exclus: evsMes('exclusividade', ref, cid).length
  };
}

/* ---------- render ---------- */
function render() {
  const mr = $('#mesref'); mr.innerHTML = '';
  const nav = el('div', 'mesnav');
  const ant = el('button', 'mesbt', '‹'); ant.onclick = () => { mesRef = somaMes(mesRef, -1); render(); };
  const prox = el('button', 'mesbt', '›'); prox.onclick = () => { mesRef = somaMes(mesRef, 1); render(); };
  nav.append(ant, el('b', '', MESESL[+mesRef.slice(5, 7) - 1] + ' de ' + mesRef.slice(0, 4)), prox);
  if (mesRef !== mesHoje) {
    const v = el('button', 'mesbt hoje', 'Voltar ao mês atual');
    v.onclick = () => { mesRef = mesHoje; render(); };
    nav.appendChild(v);
  }
  mr.appendChild(nav);

  const tela = $('#tela'); tela.innerHTML = '';
  const R = CIDADES.map(c => resumoCidade(c, mesRef));

  /* ---- cada cidade num card só ---- */
  R.forEach(r => {
    const card = el('div', 'setor' + (r.cid === 'NOVA SOURE' ? ' ns' : ''));
    card.appendChild(el('div', 'setor-top'));

    const head = el('div', 'setor-head');
    head.appendChild(el('h2', '', cidadeNome(r.cid)));
    head.appendChild(el('p', '', r.cs.length + ' clientes' + (r.cortesias ? ' · ' + r.cortesias + ' cortesias' : '') +
      ' · rateio ' + (DIVISAO[r.cid] || []).map(([q, p]) => p + '% ' + q).join(' / ')));
    card.appendChild(head);

    const kp = el('div', 'setor-kpis');
    [
      ['Receita do mês', moneyC(r.receita), '', 'mensalidades ' + moneyC(r.recebido) + (r.atrRec ? ' · atrasados ' + moneyC(r.atrRec) : '')],
      ['Despesas do mês', moneyC(r.totDesp), '', r.receita ? pct(r.totDesp, r.receita) + '% da receita' : 'sem receita no mês'],
      ['Saldo do mês', (r.saldo < 0 ? '−' : '') + moneyC(Math.abs(r.saldo)), r.saldo < 0 ? 'alert' : 'good',
        r.receita ? 'margem de ' + pct(r.saldo, r.receita) + '%' : ''],
      ['Recebimento da carteira', pct(r.recebido, r.contratada) + '%', pct(r.recebido, r.contratada) < 70 ? 'warn' : 'good',
        r.pagos.length + ' de ' + r.cs.length + ' · contratado ' + moneyC(r.contratada)]
    ].forEach(([lab, val, cls, sub]) => {
      const d = el('div', cls);
      d.appendChild(el('span', '', lab));
      d.appendChild(el('b', '', String(val)));
      if (sub) d.appendChild(el('em', '', sub));
      kp.appendChild(d);
    });
    card.appendChild(kp);

    const cols = el('div', 'setor-cols');

    const c1 = el('div');
    c1.appendChild(el('h4', '', 'Composição do mês'));
    c1.appendChild(linha('Mensalidades recebidas', moneyC(r.recebido)));
    c1.appendChild(linha('Recebido de atrasados', moneyC(r.atrRec)));
    r.desp.slice().sort((a, b) => (a.data || '').localeCompare(b.data || ''))
      .forEach(d => c1.appendChild(linha((d.data ? br(d.data) + '  ' : '') + d.nome, '− ' + moneyC(d.valor), 'desp')));
    if (!r.desp.length) c1.appendChild(linha('Sem despesas lançadas', '—', 'desp'));
    c1.appendChild(linha('Saldo', (r.saldo < 0 ? '− ' : '') + moneyC(Math.abs(r.saldo)), r.saldo < 0 ? 'tot neg' : 'tot'));
    cols.appendChild(c1);

    const c2 = el('div');
    c2.appendChild(el('h4', '', 'Rateio de ' + cidadeNome(r.cid) + ' · ' + mesNome(mesRef)));
    (DIVISAO[r.cid] || []).forEach(([q, p]) =>
      c2.appendChild(linha(`${q} — ${p}%`, (r.saldo < 0 ? '− ' : '') + moneyC(Math.abs(r.saldo) * p / 100),
        r.saldo < 0 ? 'tot neg' : 'tot')));
    c2.appendChild(linha(r.saldo < 0 ? 'Prejuízo dividido na mesma proporção' : 'Calculado só sobre o resultado desta cidade', '', 'desp'));
    c2.appendChild(linha('Em cobrança nesta cidade',
      moneyC(r.devendo.reduce((s2, a) => s2 + a.saldo, 0)) + ' · ' + r.devendo.length + ' devedores', 'desp'));
    cols.appendChild(c2);

    card.appendChild(cols);
    tela.appendChild(card);
  });

  /* ---- quem pagou e quem não pagou ---- */
  tela.appendChild(cab('Pagamentos de ' + mesNome(mesRef), 'cliente a cliente, por cidade'));
  R.forEach(r => {
    const pagosIds = new Set(r.pagos.map(c => c.id));
    const dispIds = new Set(r.dispensados.map(c => c.id));
    const naoPagaram = r.cs.filter(c => !pagosIds.has(c.id) && !dispIds.has(c.id));
    const card = el('div', 'setor' + (r.cid === 'NOVA SOURE' ? ' ns' : ''));
    card.appendChild(el('div', 'setor-top'));
    const head = el('div', 'setor-head');
    head.appendChild(el('h2', '', cidadeNome(r.cid)));
    head.appendChild(el('p', '', r.pagos.length + ' pagaram · ' + naoPagaram.length + ' em aberto' +
      (r.dispensados.length ? ' · ' + r.dispensados.length + ' dispensados' : '')));
    card.appendChild(head);
    const cols = el('div', 'setor-cols');

    const c1 = el('div');
    c1.appendChild(el('h4', '', 'Pagaram — ' + moneyC(r.recebido)));
    if (!r.pagos.length) c1.appendChild(linha('Ninguém pagou neste mês', '', 'desp'));
    r.pagos.slice().sort((a, b) => a.empresa.localeCompare(b.empresa, 'pt-BR')).forEach(c => {
      const ev = DB.eventos.filter(e => e.cli === c.id && e.tipo === 'pagamento' &&
        (e.ref || e.data.slice(0, 7)) === mesRef).sort((a, b) => b.data.localeCompare(a.data))[0];
      const l = el('div', 'lin');
      l.appendChild(el('span', '', c.empresa));
      l.appendChild(el('span', 'tag on', ev && ev.data ? br(ev.data) : 'pago'));
      l.appendChild(el('b', '', moneyC(ev ? ev.valor : 0)));
      c1.appendChild(l);
    });
    cols.appendChild(c1);

    const c2 = el('div');
    const falta = naoPagaram.reduce((s2, c) => s2 + (c.valor || 0), 0);
    c2.appendChild(el('h4', '', 'Não pagaram — ' + moneyC(falta)));
    if (!naoPagaram.length) c2.appendChild(linha('Todos em dia neste mês', '', 'desp'));
    naoPagaram.sort((a, b) => (b.valor || 0) - (a.valor || 0)).forEach(c => {
      const l = el('div', 'lin');
      l.appendChild(el('span', '', c.empresa));
      if (c.diaVenc) l.appendChild(el('span', 'tag off', 'vence dia ' + c.diaVenc));
      l.appendChild(el('b', '', c.valor ? moneyC(c.valor) : 'sem valor'));
      c2.appendChild(l);
    });
    r.dispensados.forEach(c => {
      const ev = DB.eventos.find(e => e.cli === c.id && e.tipo === 'ajuste' && (e.ref || '') === mesRef);
      const l = el('div', 'lin desp');
      l.appendChild(el('span', '', c.empresa));
      l.appendChild(el('span', 'tag', 'dispensado' + (ev && ev.nota ? ' · ' + ev.nota.split(' — ')[0] : '')));
      l.appendChild(el('b', '', '—'));
      c2.appendChild(l);
    });
    cols.appendChild(c2);
    card.appendChild(cols);
    if (r.quitacoes.length) {
      const c3 = el('div');
      c3.style.borderTop = '1px solid var(--line)';
      c3.style.padding = '16px 20px 18px';
      c3.appendChild(el('h4', '', 'Quitações de meses anteriores — ' + moneyC(r.atrRec)));
      r.quitacoes.forEach(q => {
        const l = el('div', 'lin');
        l.appendChild(el('span', '', q.nome));
        l.appendChild(el('span', 'tag on', q.comp ? 'ref ' + mesNome(q.comp) : 'dívida anterior'));
        l.appendChild(el('b', '', moneyC(q.valor)));
        c3.appendChild(l);
      });
      card.appendChild(c3);
    }
    tela.appendChild(card);
  });

  /* ---- inadimplência separada ---- */
  tela.appendChild(cab('Inadimplência', 'cobranças de meses anteriores'));
  const ing = el('div', 'duas');
  CIDADES.forEach(cid => {
    const dev = DB.atrasados.filter(a => a.cidade === cid && a.saldo > 0).sort((a, b) => b.saldo - a.saldo);
    const tot = dev.reduce((s2, a) => s2 + a.saldo, 0);
    const noAr = dev.filter(a => (a.status || '').toLowerCase() === 'online').length;
    const bx = el('div', 'box cidade');
    const h = el('h3', '', cidadeNome(cid));
    h.appendChild(el('em', '', moneyC(tot) + ' · ' + dev.length + ' devedores'));
    bx.appendChild(h);
    if (!dev.length) bx.appendChild(el('div', 'lin desp', 'Nenhum devedor em aberto.'));
    dev.forEach(a => {
      const l = el('div', 'lin');
      const on = (a.status || '').toLowerCase() === 'online';
      const nm = el('span', '', a.nome);
      l.appendChild(nm);
      l.appendChild(el('span', 'tag ' + (on ? 'on' : 'off'), on ? 'no ar' : 'pausado'));
      l.appendChild(el('b', '', moneyC(a.saldo)));
      bx.appendChild(l);
    });
    if (dev.length) bx.appendChild(linha('Total em aberto', moneyC(tot), 'tot'));
    bx.appendChild(linha('Ainda no ar devendo', noAr + ' de ' + dev.length, 'desp'));
    ing.appendChild(bx);
  });
  tela.appendChild(ing);

  tela.appendChild(el('div', 'aviso', 'Cada cidade é fechada por si: receita, despesa, saldo e rateio nunca se misturam. ' +
    'Olindina divide 50% para cada sócio; Nova Soure divide 75% Ramon e 25% Anai. ' +
    'Página só de leitura — mostra o que foi lançado na gestão da carteira.'));
}

function kpi(dados) {
  const k = el('div', 'kpis');
  dados.forEach(([lab, val, cls, sub]) => {
    const d = el('div', 'kpi ' + (cls || ''));
    d.appendChild(el('span', '', lab));
    d.appendChild(el('b', '', String(val)));
    if (sub) d.appendChild(el('em', '', sub));
    k.appendChild(d);
  });
  return k;
}
function cab(titulo, sub) {
  const b = el('div', 'blockhead'); b.appendChild(el('h2', '', titulo));
  if (sub) b.appendChild(el('em', '', sub));
  return b;
}
function linha(rot, val, cls) {
  const l = el('div', 'lin ' + (cls || ''));
  l.appendChild(el('span', '', rot)); l.appendChild(el('b', '', val));
  return l;
}

carregar().then(render).catch(e => {
  $('#tela').innerHTML = '<div class="box empty">Não consegui carregar os dados (' + e.message +
    '). Confira se a página de gestão já gravou no Supabase.</div>';
});
</script>
