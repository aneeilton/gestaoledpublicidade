<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED+ Publicidade — Carteira de clientes</title>
<style>
/* ============ tokens ============ */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F8F9FB; --surface-3:#F1F3F6;
  --border:#E3E6EC; --line:#EDEFF3;
  --text:#12141A; --muted:#646B7A; --muted-2:#9AA1AF;
  --accent:#2457C5; --accent-soft:#EAF0FD; --accent-ink:#1B44A0;
  --ok:#0F9D58; --ok-soft:#E8F6EE; --warn:#C97A09; --warn-soft:#FDF3E3;
  --bad:#D23B45; --bad-soft:#FDECEE; --zap:#0F8F6F;
  --r-lg:16px; --r-md:12px; --r-sm:9px;
  --sh-1:0 1px 2px rgba(18,20,26,.06);
  --sh-2:0 2px 8px rgba(18,20,26,.07), 0 1px 2px rgba(18,20,26,.05);
  --sh-3:0 12px 34px rgba(18,20,26,.16);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --appbar:64px; --navbar:64px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1115; --surface:#171A20; --surface-2:#1D2128; --surface-3:#232831;
    --border:#2A2F39; --line:#232831;
    --text:#ECEEF2; --muted:#9AA2B1; --muted-2:#6E7684;
    --accent:#5B8DEF; --accent-soft:#1A2438; --accent-ink:#9DBBF7;
    --ok:#3FCB84; --ok-soft:#14291F; --warn:#E9A93C; --warn-soft:#2A2216;
    --bad:#F2707A; --bad-soft:#2B181B; --zap:#3FBF9B;
    --sh-1:none; --sh-2:0 2px 10px rgba(0,0,0,.35); --sh-3:0 16px 40px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--navbar) + 18px)}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.012em}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.tabular{font-variant-numeric:tabular-nums}

/* ============ app bar ============ */
.appbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border)}
@media (prefers-color-scheme:dark){.appbar{background:rgba(23,26,32,.86)}}
.appbar-in{max-width:1120px;margin:0 auto;padding:0 16px;height:var(--appbar);display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--accent),#123A96);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:-.02em;flex:none;
  box-shadow:0 2px 8px rgba(36,87,197,.32)}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-size:15.5px;font-weight:650;letter-spacing:-.015em}
.brand small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saveflag{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
  background:var(--surface-3);border-radius:20px;padding:6px 12px;white-space:nowrap}
.saveflag i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px rgba(15,157,88,.16)}
.saveflag.err i{background:var(--bad);box-shadow:0 0 0 3px rgba(210,59,69,.18)}
.linkresumo{font-size:13px;color:var(--accent);text-decoration:none;font-weight:550;white-space:nowrap}
.linkresumo:hover{text-decoration:underline}

/* ============ navegação ============ */
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:4px;margin:16px 0 10px;box-shadow:var(--sh-1);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:none;border:0;
  color:var(--muted);font-size:14px;font-weight:550;padding:10px 14px;border-radius:11px;white-space:nowrap;
  transition:background .15s,color .15s}
.tabs button svg{width:17px;height:17px;flex:none}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(36,87,197,.28)}
.tabs button em{font-style:normal;font-size:11.5px;font-weight:650;background:var(--bad);color:#fff;
  border-radius:20px;padding:1px 7px;line-height:1.5}
.tabs button.on em{background:rgba(255,255,255,.25)}
.tabs button em:empty{display:none}

/* mês */
.mesref{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 2px 18px;font-size:12.5px;color:var(--muted)}
.mesnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:4px;box-shadow:var(--sh-1)}
.mesnav b{font-size:13.5px;font-weight:600;color:var(--text);min-width:132px;text-align:center}
.mesbt{background:none;border:0;color:var(--muted);width:30px;height:30px;border-radius:9px;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center;font-size:17px}
.mesbt:hover{background:var(--surface-3);color:var(--text)}
.mesbt.hoje{width:auto;padding:0 12px;font-size:12.5px;color:var(--accent);font-weight:550}
.mesobs{color:var(--muted-2)}

/* ============ kpis ============ */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:6px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 15px 15px;
  box-shadow:var(--sh-1);position:relative;overflow:hidden}
.kpi span{display:block;font-size:11.5px;color:var(--muted);line-height:1.35;min-height:31px;font-weight:500}
.kpi b{display:block;font-size:25px;font-weight:680;line-height:1.05;margin-top:7px;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.kpi.good b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.alert b{color:var(--bad)}
.kpi.good::after,.kpi.warn::after,.kpi.alert::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi.good::after{background:var(--ok)} .kpi.warn::after{background:var(--warn)} .kpi.alert::after{background:var(--bad)}

/* ============ blocos ============ */
.blockhead{display:flex;align-items:center;gap:10px;margin:26px 2px 10px;flex-wrap:wrap}
.blockhead h2{font-size:16px;font-weight:650}
.blockhead em{font-style:normal;font-size:12.5px;color:var(--muted)}
.blockhead button{margin-left:auto;background:var(--surface);border:1px solid var(--border);color:var(--accent);
  font-size:12.5px;font-weight:550;padding:6px 12px;border-radius:20px;box-shadow:var(--sh-1)}
.blockhead button:hover{background:var(--accent-soft)}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.empty{padding:20px 16px;color:var(--muted);font-size:13.5px;text-align:center}

/* ============ filtros ============ */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=month],input[type=number],select,textarea{
  background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 12px;font-size:14px;
  border-radius:var(--r-sm);box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
input::placeholder{color:var(--muted-2)}
.filters input[type=text]{flex:1;min-width:180px}
.chip{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:9px 14px;font-size:13px;
  font-weight:500;border-radius:20px;box-shadow:var(--sh-1)}
.chip:hover{color:var(--text);border-color:var(--muted-2)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(36,87,197,.25)}

/* ============ lista ============ */
.rowhead,.row{display:grid;grid-template-columns:40px 1fr 116px 92px 64px 262px;gap:12px;align-items:center}
.rowhead{padding:0 16px 8px;font-size:11.5px;color:var(--muted-2);font-weight:500}
.row{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 16px;
  color:var(--text);cursor:pointer;transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:11px;background:var(--surface-3);color:var(--muted);display:flex;
  align-items:center;justify-content:center;font-size:12.5px;font-weight:650;letter-spacing:-.02em;flex:none}
.avatar.a1{background:var(--accent-soft);color:var(--accent-ink)}
.avatar.a2{background:var(--ok-soft);color:var(--ok)}
.avatar.a3{background:var(--warn-soft);color:var(--warn)}
.avatar.a4{background:var(--bad-soft);color:var(--bad)}
.nome{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.nome small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.r{text-align:right;font-variant-numeric:tabular-nums}
.acoes{display:flex;gap:6px;justify-content:flex-end}

/* pílulas de status */
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);border-radius:20px;padding:7px 13px 7px 10px;font-size:12.5px;font-weight:550;white-space:nowrap;
  box-shadow:var(--sh-1);transition:transform .1s,filter .12s}
.pill .pdot{width:8px;height:8px;border-radius:50%;background:var(--muted-2);flex:none}
.pill.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.on .pdot{background:var(--ok)}
.pill.wait{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.wait .pdot{background:var(--warn)}
.pill.off{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.pill.off .pdot{background:var(--bad)}
.pill.dead{opacity:.45}
.pill:hover:not(:disabled){transform:translateY(-1px);filter:brightness(.98)}
.pill:active:not(:disabled){transform:none}
.leds{display:flex;gap:4px;align-items:center}
.px{width:9px;height:9px;border-radius:50%;background:var(--muted-2)}
.px.on{background:var(--ok)} .px.wait{background:var(--warn)} .px.off{background:var(--bad)}
.pxbtn{width:28px;height:28px;border:0;background:none;border-radius:50%;display:flex;align-items:center;
  justify-content:center;padding:0}
.mini{border:1px solid var(--border);background:var(--surface);color:var(--zap);width:34px;height:32px;flex:none;
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  box-shadow:var(--sh-1)}
.mini:hover{background:var(--zap);color:#fff;border-color:var(--zap)}
.mini:not(.zap){color:var(--muted)}
.mini:not(.zap):hover{background:var(--surface-3);color:var(--text);border-color:var(--muted-2)}

/* linhas alternativas */
.row.prosp,.row.enc{grid-template-columns:1fr auto}
.row.atr{grid-template-columns:1fr 110px 96px}
.row.chip{grid-template-columns:1fr auto auto}
.row.enc{opacity:.85}
.cortesias .row{grid-template-columns:1fr 140px 96px}

/* exclusividades */
.exc{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.exc:last-child{border-bottom:0}
.exc time{font-size:12.5px;color:var(--accent);font-weight:600;flex:none;width:104px;font-variant-numeric:tabular-nums}
.exc.passada time{color:var(--muted-2);font-weight:500}
.exc b{font-weight:550}
.exc span{color:var(--muted);font-size:12.5px;margin-left:auto;text-align:right}

/* resultado do mês */
.lin{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.lin:last-child{border-bottom:0}
.lin b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.lin.desp span,.lin.desp b{color:var(--muted);font-weight:500}
.lin.sub{background:var(--surface-2)}
.lin.sub span,.lin.sub b{color:var(--muted)}
.lin.tot{background:var(--surface-2);font-size:15.5px;font-weight:600}
.lin.tot b{color:var(--ok);font-weight:700}
.lin.tot.neg b{color:var(--bad)}
.linx{background:none;border:0;color:var(--muted-2);font-size:13px;padding:0 0 0 8px}
.linx:hover{color:var(--bad)}
.linbt{margin-left:auto;background:var(--accent-soft);border:0;color:var(--accent-ink);padding:7px 12px;
  border-radius:20px;font-size:12.5px;font-weight:550}
.btdespesa{width:100%;border:0;border-top:1px solid var(--border);background:var(--accent);color:#fff;
  padding:15px;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.btdespesa:hover{background:var(--accent-ink)}

/* prospecção */
.formlinha{display:flex;gap:8px;padding:16px;flex-wrap:wrap}
.formlinha input{flex:1;min-width:160px}
.formlinha .primary{width:auto;flex:none;padding:10px 20px}

/* ============ painel lateral ============ */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);display:none;z-index:40;backdrop-filter:blur(2px)}
.scrim.open{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(450px,100%);background:var(--bg);z-index:50;
  transform:translateX(101%);transition:transform .24s cubic-bezier(.32,.72,0,1);overflow-y:auto;box-shadow:var(--sh-3)}
.sheet.open{transform:none}
.sheet header{padding:18px 20px 15px;border-bottom:1px solid var(--border);position:sticky;top:0;
  background:var(--surface);z-index:2}
.sheet header h2{font-size:19px;padding-right:40px;letter-spacing:-.02em}
.sheet header p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.sheet .body{padding:18px 20px 40px}
.close{position:absolute;top:15px;right:16px;background:var(--surface-3);border:0;color:var(--muted);
  width:32px;height:32px;border-radius:10px;line-height:1;font-size:15px}
.close:hover{background:var(--border);color:var(--text)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.act{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:13px 10px;font-size:13.5px;
  font-weight:550;border-radius:var(--r-md);box-shadow:var(--sh-1);transition:transform .1s}
.act:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.act.wide{grid-column:1/-1}
.act.zap{color:var(--zap);border-color:transparent;background:var(--ok-soft)}
.act.zap:hover{background:var(--zap);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.f{margin-bottom:11px}
.f input,.f select,.f textarea{width:100%}
.subhead{font-size:11.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;font-weight:600;
  margin:22px 0 10px}
.primary{background:var(--accent);border:0;color:#fff;padding:13px 16px;font-size:14.5px;font-weight:600;
  border-radius:var(--r-md);width:100%;box-shadow:0 2px 8px rgba(36,87,197,.28)}
.primary:hover{background:var(--accent-ink)}
.ghost{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:10px 15px;font-size:13px;
  font-weight:500;border-radius:var(--r-sm);box-shadow:var(--sh-1)}
.ghost:hover{color:var(--text);border-color:var(--muted-2)}
.hist{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.hist div{display:flex;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px;
  color:var(--muted);align-items:baseline}
.hist div:last-child{border-bottom:0}
.hist time{font-size:12px;color:var(--muted-2);flex:none;width:88px;font-variant-numeric:tabular-nums}
.hist b{font-size:11px;flex:none;width:62px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.hist s{flex:1;text-decoration:none}
.hist button{background:none;border:0;color:var(--muted-2);padding:0 2px}
.hist button:hover{color:var(--bad)}

/* ============ modal ============ */
.modalbg{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:60;display:flex;align-items:center;
  justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modalcx{background:var(--surface);border-radius:18px;width:min(420px,100%);max-height:88vh;overflow-y:auto;
  padding:22px;box-shadow:var(--sh-3);animation:sobe .18s cubic-bezier(.32,.72,0,1)}
@keyframes sobe{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.modalcx h3{font-size:17.5px;margin-bottom:16px;letter-spacing:-.02em}
.modalform .f{margin-bottom:12px}
.modalform input,.modalform select,.modalform textarea{width:100%}
.modalacts{display:flex;gap:9px;margin-top:20px}
.modalacts .ghost{flex:1;padding:13px}
.modalacts .primary{flex:1.5}
.seg{display:flex;gap:6px}
.segb{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:11px;
  border-radius:var(--r-sm);font-size:13.5px;font-weight:550}
.segb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chk{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--text);margin:6px 0 2px;cursor:pointer;
  background:var(--surface-2);padding:11px 12px;border-radius:var(--r-sm)}
.chk input{width:17px;height:17px;accent-color:var(--accent)}

/* popover */
.popbg{position:fixed;inset:0;z-index:70}
.popover{position:fixed;z-index:71;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--sh-3);overflow:hidden;padding:5px;animation:sobe .14s ease}
.poptit{font-size:11.5px;color:var(--muted-2);padding:9px 11px 7px;border-bottom:1px solid var(--line);margin-bottom:5px}
.popbt{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:11px;
  font-size:13.5px;font-weight:500;border-radius:9px}
.popbt:hover{background:var(--accent-soft);color:var(--accent-ink)}

/* diversos */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 2px 0;align-items:center}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--muted-2)}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--border)}
.warnbar{background:var(--warn-soft);border:1px solid transparent;border-left:3px solid var(--warn);color:var(--warn);
  padding:11px 13px;font-size:13px;border-radius:var(--r-sm);margin-bottom:14px}
.warnbar b{color:var(--warn)}
.rodape{text-align:center;font-size:12px;color:var(--muted-2);margin-top:30px}

/* ============ mobile: barra inferior ============ */
@media (max-width:860px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rowhead{display:none}
  .row{grid-template-columns:40px 1fr auto;row-gap:10px}
  .row .acoes{grid-column:1/-1;justify-content:flex-start;flex-wrap:wrap}
  .row .cell.resp{display:none}
  .row.prosp,.row.enc,.row.atr,.cortesias .row{grid-template-columns:1fr auto}
  .grid2{grid-template-columns:1fr}
  .appbar-in{height:58px}
  .brand small{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;border-radius:0;border-left:0;border-right:0;
    border-bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:35;gap:0;
    box-shadow:0 -2px 16px rgba(18,20,26,.08)}
  .tabs button{flex-direction:column;gap:3px;font-size:11px;font-weight:550;padding:7px 4px;border-radius:10px}
  .tabs button svg{width:20px;height:20px}
  .tabs button.on{background:transparent;color:var(--accent);box-shadow:none}
  .tabs button em{position:absolute;transform:translate(14px,-6px);padding:0 6px;font-size:10.5px}
  .tabs button.on em{background:var(--bad)}
  .mesref{margin-top:14px}

/* nomes no mesmo padrão: Primeira maiúscula, resto minúsculo, siglas preservadas */
const MINUSC = new Set(['da', 'de', 'do', 'das', 'dos', 'e', 'di', 'du', 'em', 'no', 'na', 'a', 'o']);
const SIGLAS = new Set(['APLB', 'CEAP', 'SEBRAE']);   // siglas com vogal que devem ficar em caixa alta
const capitaliza = w => w.toLowerCase().replace(/[a-zà-ÿ]/, ch => ch.toUpperCase());
function padroniza(nome) {
  return String(nome || '').trim().replace(/\s+/g, ' ').split(' ').map((p, i) => {
    const l = p.toLowerCase();
    if (i > 0 && MINUSC.has(l)) return l;                       // da, de, do...
    const letras = p.replace(/[^A-Za-zÀ-ÿ]/g, '');
    const caixaAlta = letras.length > 1 && letras === letras.toUpperCase();
    const semVogal = !/[AEIOUÀ-Ý]/.test(letras);
    if (caixaAlta && (semVogal || SIGLAS.has(letras) || (i === 0 && letras.length <= 3))) return p.toUpperCase();  // siglas
    return capitaliza(p);
  }).join(' ');
}
/* máscaras de telefone e dinheiro */
function mascTel(v) {
  const d = String(v || '').replace(/\D/g, '').slice(0, 11);
  if (d.length <= 2) return d;
  if (d.length <= 10) return d.slice(0, 2) + ' ' + d.slice(2);
  return d.slice(0, 2) + ' ' + d.slice(2, 3) + ' ' + d.slice(3);
}
function mascMoeda(v) {
  const d = String(v || '').replace(/\D/g, '');
  if (!d) return '';
  return 'R$ ' + (parseInt(d, 10) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
const desmascMoeda = v => {

};

function ligaMascaras(raiz) {
  raiz.querySelectorAll('[data-mask=tel]').forEach(i => {

  raiz.querySelectorAll('[data-mask=moeda]').forEach(i => {
    i.inputMode = 'numeric';

  raiz.querySelectorAll('[data-mask=num]').forEach(i => { i.inputMode = 'numeric'; });
}

function zapNum(tel) {
  let d = String(tel || '').replace(/\D/g, '');
  if (!d) return null;
  if (d.length <= 11) d = '55' + d;
  return d.length >= 12 ? d : null;
}

async function carregar() {
  if (usaSupabase()) {
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/led_estado?id=eq.1&select=dados`,

      }
      const j = await r.json();
      if (j && j[0] && j[0].dados && j[0].dados.clientes) { DB = j[0].dados; normalizar(); return; }

      DB = semear(); normalizar(); return;

  }
  try {
    const r = await window.storage.get(KEY);
    if (r && r.value) { DB = JSON.parse(r.value); normalizar(); return; }
  } catch (e) { }
  DB = semear(); normalizar(); await salvar();
}
function normalizar() {

async function salvar() {
  if (memoriaSomente) { flag(false, 'Só nesta sessão'); return; }
  if (usaSupabase()) {
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/led_estado?on_conflict=id`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          Prefer: 'resolution=merge-duplicates,return=representation'
        },
        body: JSON.stringify({ id: 1, dados: DB, atualizado_em: new Date().toISOString() })
      });
      const txt = await r.text();
      if (!r.ok) throw new Error(r.status + ' ' + txt.slice(0, 160));
      let j = null; try { j = JSON.parse(txt); } catch (e) { }
      if (!Array.isArray(j) || !j.length) throw new Error('a gravação não teve efeito — a policy da tabela led_estado está bloqueando');
      $('#warn').innerHTML = '';
      flag(true, 'Salvo ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));

        '. Enquanto isso as alterações valem só nesta tela — não feche sem resolver.</div>';
    }
    return;
  }
  try {
    const r = await window.storage.set(KEY, JSON.stringify(DB));
    if (!r) throw new Error('sem retorno');
    flag(true, 'Salvo ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    memoriaSomente = true; flag(false, 'Não salvo');
    $('#warn').innerHTML = '<div class="warnbar">Não consegui gravar neste ambiente. As alterações valem só até fechar a página — baixe o backup em JSON antes de sair.</div>';
  }
}

function refsEmAberto(c) {
  if (eCortesia(c) || !c.valor) return [];
  const out = [];
  let r = c.entrada || '2026-08';
  const limite = c.saida && c.saida < mesHoje ? c.saida : mesHoje;
  while (r <= limite) {
    const pago = DB.eventos.some(e => e.cli === c.id && (e.tipo === 'pagamento' || e.tipo === 'ajuste') &&
      (e.ref || e.data.slice(0, 7)) === r);
    const venceu = r < mesHoje || (c.diaVenc && hoje().getDate() > c.diaVenc);
    if (!pago && venceu) out.push(r);
    r = somaMes(r, 1);

  return out;
}

function recebimentosDoMes(ref, cidade) {
  const out = [];
  DB.eventos.filter(e => e.tipo === 'pagamento' && e.data.slice(0, 7) === ref).forEach(e => {
    const c = DB.clientes.find(x => x.id === e.cli);

    const comp = e.ref || e.data.slice(0, 7);
    out.push({ nome: c.empresa, cli: c.id, valor: e.valor || 0, data: e.data, comp, atraso: comp < ref });
  });
  DB.atrasados.forEach(a => {
    if (cidade && a.cidade !== cidade) return;
    (a.recebidos || []).filter(r => r.data.slice(0, 7) === ref).forEach(r => {
      out.push({ nome: a.nome, avulso: a.id, valor: r.valor, data: r.data, comp: null, atraso: true });
    });
  });
  return out.sort((x, y) => y.data.localeCompare(x.data));
}

}
const pagoNoMes = c => DB.eventos.some(e => e.cli === c.id && e.tipo === 'pagamento' && (e.ref || e.data.slice(0, 7)) === mesRef);
const dispensado = (c, ref) => DB.eventos.find(e => e.cli === c.id && e.tipo === 'ajuste' && (e.ref || '') === (ref || mesRef));
function statusPag(c) {
  if (eCortesia(c) || !c.valor) return { s: '', t: eCortesia(c) ? 'cortesia — sem cobrança' : 'sem valor definido' };
  if (pagoNoMes(c)) return { s: 'on', t: 'pago em ' + mesNome(mesRef) };
  const dp = dispensado(c);
  if (dp) return { s: '', t: 'mês dispensado' + (dp.nota ? ': ' + dp.nota : '') };

function statusContato(c) {

function modal(titulo, campos, aoConfirmar, rotulo) {
  const fundo = el('div', 'modalbg');
  const cx = el('div', 'modalcx');
  cx.appendChild(el('h3', '', titulo));
  const form = el('div', 'modalform');
  campos.forEach(c => {
    if (c.tipo === 'opcoes') {
      const f = el('div', 'f');
      f.appendChild(el('label', '', c.rot));
      const seg = el('div', 'seg');
      c.opcoes.forEach(([v, t]) => {
        const b = el('button', 'segb' + (v === c.valor ? ' on' : ''), t);
        b.onclick = () => { c.valor = v; [...seg.children].forEach(x => x.classList.toggle('on', x === b)); };
        seg.appendChild(b);
      });
      f.appendChild(seg); form.appendChild(f); c._get = () => c.valor;
      return;
    }
    if (c.tipo === 'check') {
      const f = el('label', 'chk');
      const i = el('input'); i.type = 'checkbox'; i.checked = c.valor !== false;
      f.append(i, el('span', '', c.rot)); form.appendChild(f); c._get = () => i.checked;
      return;
    }
    const f = el('div', 'f');
    f.appendChild(el('label', '', c.rot));
    let i;
    if (c.tipo === 'select') {
      i = el('select');
      c.opcoes.forEach(([v, t]) => { const o = el('option', '', t); o.value = v; if (v === c.valor) o.selected = true; i.appendChild(o); });
    } else if (c.tipo === 'textarea') {
      i = el('textarea'); i.rows = 2; i.value = c.valor || '';
    } else if (c.tipo === 'lista') {
      i = el('input'); i.type = 'text'; i.value = c.valor || '';
      if (c.ph) i.placeholder = c.ph;
      i.setAttribute('list', 'dl_' + c.id);
      const dl = el('datalist'); dl.id = 'dl_' + c.id;
      c.opcoes.forEach(([n, v]) => { const o = el('option'); o.value = n; o.label = fmtMoedaEdit(v); dl.appendChild(o); });
      f.appendChild(dl);
      i.oninput = () => {
        const m = c.opcoes.find(o => o[0].toLowerCase() === i.value.trim().toLowerCase());
        if (m && c.preenche) {
          const alvo = campos.find(x => x.id === c.preenche);
          if (alvo && alvo._el) alvo._el.value = fmtMoedaEdit(m[1]);
        }
      };
    } else {
      i = el('input'); i.type = c.tipo === 'hora' ? 'time' : c.tipo === 'data' ? 'date' : c.tipo === 'mes' ? 'month' : 'text';
      i.value = c.valor || ''; if (c.ph) i.placeholder = c.ph;
      if (c.mask) i.setAttribute('data-mask', c.mask);
    }
    f.appendChild(i); form.appendChild(f);
    c._get = () => i.value;
    c._el = i;
  });
  cx.appendChild(form);
  const acoes = el('div', 'modalacts');
  const cancelar = el('button', 'ghost', 'Cancelar');
  const ok = el('button', 'primary', rotulo || 'Confirmar');
  cancelar.onclick = () => fundo.remove();
  ok.onclick = async () => {
    const vals = {}; campos.forEach(c => vals[c.id] = c._get());
    const erro = await aoConfirmar(vals);
    if (!erro) fundo.remove();
  };
  acoes.append(cancelar, ok); cx.appendChild(acoes);
  fundo.appendChild(cx);
  fundo.onclick = e => { if (e.target === fundo) fundo.remove(); };
  document.body.appendChild(fundo);
  ligaMascaras(cx);
  const p = cx.querySelector('input:not([type=checkbox]),textarea,select'); if (p) p.focus();
  return fundo;
}

  if (!evs.length) ex.appendChild(el('div', 'empty', 'Nenhuma registrada ainda. Use o botão ★ na lista para avisar o cliente pelo WhatsApp e marcar dia e hora.'));
  evs.slice(0, 8).forEach(e => {
    const c = DB.clientes.find(x => x.id === e.cli);
    const d = el('div', 'exc' + (e.data >= hojeIso ? '' : ' passada'));
    d.appendChild(el('time', '', br(e.data) + (e.hora ? ' · ' + e.hora : '')));
    d.appendChild(el('b', '', c ? c.empresa : ''));
    d.appendChild(el('span', '', e.nota || (e.data >= hojeIso ? 'agendada' : '')));
    ex.appendChild(d);
  });
  tela.appendChild(ex);

  /* resultado do mês */
  const atrRec = caixaMes.filter(x => x.atraso).reduce((s, x) => s + x.valor, 0);
  const desp = DB.despesas.filter(d => d.cidade === aba && d.ref === mesRef)
    .sort((a, b) => (a.data || '').localeCompare(b.data || ''));
  const totDesp = desp.reduce((t, d) => t + d.valor, 0);
  const saldo = recebido + atrRec - totDesp;
  tela.appendChild(bloco('Resultado do mês', cidadeNome(aba)));
  const rb = el('div', 'box');
  if (!desp.length) {
    const ant = DB.despesas.filter(d => d.cidade === aba && d.ref === somaMes(mesRef, -1));
    if (ant.length) {
      const l = el('div', 'lin');
      l.appendChild(el('span', '', 'Nenhuma despesa lançada em ' + mesNome(mesRef) + '.'));
      const b = el('button', 'linbt', `Repetir as ${ant.length} de ${mesNome(somaMes(mesRef, -1))}`);
      b.onclick = async () => {
        ant.forEach(d => {
          const dia = (d.data || '').slice(8, 10) || '01';
          const ultimo = new Date(+mesRef.slice(0, 4), +mesRef.slice(5, 7), 0).getDate();
          const data = mesRef + '-' + String(Math.min(+dia, ultimo)).padStart(2, '0');
          DB.despesas.push({ id: uid(), cidade: aba, ref: mesRef, data, nome: d.nome, valor: d.valor });
        });
        await salvar(); render();
      };
      l.appendChild(b); rb.appendChild(l);
    }
  }
  rb.appendChild(linha('Recebido de mensalidades', money(recebido)));
  rb.appendChild(linha('Recebido de atrasados', money(atrRec)));
  desp.forEach(d => {
    const l = linha((d.data ? br(d.data) + '  ' : '') + d.nome, '− ' + money(d.valor), 'desp');
    const x = el('button', 'linx', '✕'); x.title = 'Remover despesa';
    x.onclick = async () => {
      if (!confirm('Remover a despesa "' + d.nome + '"?')) return;
      DB.despesas = DB.despesas.filter(y => y.id !== d.id); await salvar(); render();
    };
    l.appendChild(x); rb.appendChild(l);
  });
  rb.appendChild(linha('Total de despesas', money(totDesp), 'sub'));
  rb.appendChild(linha('Saldo do mês', (saldo < 0 ? '− ' : '') + money(Math.abs(saldo)), saldo < 0 ? 'tot neg' : 'tot'));
  (DIVISAO[aba] || []).forEach(([quem, pct]) => {
    rb.appendChild(linha(`${pct}% ${quem}`, (saldo < 0 ? '− ' : '') + money(Math.abs(saldo) * pct / 100), 'sub'));
  });
  const bd = el('button', 'btdespesa', '+  Lançar despesa de ' + cidadeNome(aba));
  bd.onclick = novaDespesa;
  rb.appendChild(bd);
  tela.appendChild(rb);

  /* anúncios encerrados */
  const encerrados = DB.clientes.filter(c => c.conta === aba && c.ativo === false);
  tela.appendChild(bloco('Anúncios encerrados', encerrados.length + ' na base de ex-clientes',
    [verEncerrados ? 'Ocultar' : 'Mostrar', () => { verEncerrados = !verEncerrados; render(); }]));
  if (verEncerrados) {
    const ex = el('div', 'box');
    if (!encerrados.length) ex.appendChild(el('div', 'empty', 'Nenhum anúncio encerrado nesta cidade.'));
    encerrados.sort((a, b) => (b.encerradoEm || '').localeCompare(a.encerradoEm || '')).forEach(c => {
      const r = el('div', 'row enc');
      const n = el('div', 'nome', c.empresa);
      n.appendChild(el('small', '', [
        c.responsavel || 'sem responsável',
        c.encerradoEm ? 'encerrado em ' + br(c.encerradoEm) : '',
        c.valor ? 'pagava ' + money(c.valor) : ''
      ].filter(Boolean).join(' · ')));
      r.appendChild(n);
      const acoes = el('div', 'acoes');
      const z = el('button', 'mini zap', '✆'); z.title = 'Abrir conversa no WhatsApp';
      z.onclick = async e => {
        e.stopPropagation();
        const num = await garantirZap(c);
        if (num) window.open(`https://wa.me/${num}`, '_blank');
      };
      const v = el('button', 'mini', '↩'); v.title = 'Reativar como cliente em ' + mesNome(mesRef);
      v.onclick = async e => {
        e.stopPropagation();
        if (!confirm(`Reativar ${c.empresa} como cliente a partir de ${mesNome(mesRef)}?`)) return;
        c.ativo = true; delete c.saida; c.entrada = mesRef; delete c.encerradoEm;
        await salvar(); render(); abrirCliente(c.id);
      };
      acoes.append(z, v); r.appendChild(acoes);
      r.onclick = () => abrirCliente(c.id);
      ex.appendChild(r);
    });
    tela.appendChild(ex);
  }

  /* cortesias */
  tela.appendChild(bloco('Cortesias', cort.length + ' sem cobrança', [verCortesias ? 'Ocultar' : 'Mostrar', () => { verCortesias = !verCortesias; render(); }]));
  if (verCortesias) {
    const cx = el('div', 'box cortesias');
    if (!cort.length) cx.appendChild(el('div', 'empty', 'Nenhuma cortesia nesta cidade.'));
    cort.sort((a, b) => a.empresa.localeCompare(b.empresa, 'pt-BR')).forEach(c => {
      const r = el('button', 'row cortesia-row');
      r.appendChild(el('div', 'nome', c.empresa));
      r.appendChild(el('div', 'cell resp', c.responsavel || '—'));
      r.appendChild(el('div', 'cell r', c.cod ? 'cód ' + c.cod : '—'));
      r.onclick = () => abrirCliente(c.id);
      cx.appendChild(r);
    });
    tela.appendChild(cx);
  }
  tela.appendChild(rodape());
}

function avatar(nome) {
  const parts = String(nome || '?').replace(/[^\wÀ-ÿ ]/g, '').trim().split(/\s+/);
  const ini = (parts[0] || '?')[0] + (parts[1] ? parts[1][0] : '');
  let h = 0; for (const ch of String(nome)) h = (h * 31 + ch.charCodeAt(0)) % 4;
  return el('div', 'avatar a' + (h + 1), ini.toUpperCase());
}

function acoesLinha(c) {
  const g = el('div', 'acoes');
  const st = leds(c);
  const defs = [
    { i: 0, rot: 'Anúncio', tipo: 'arte' },
    { i: 1, rot: 'Exclus.', tipo: 'exclusividade' },
    { i: 2, rot: 'Pagto', tipo: 'pagamento' }
  ];
  defs.forEach(d => {
    const feito = st[d.i].s === 'on';
    const inativo = eCortesia(c) || (d.tipo === 'pagamento' && !c.valor);
    const b = el('button', 'pill ' + (inativo ? 'dead' : st[d.i].s || 'sem'));
    b.appendChild(el('i', 'pdot'));
    b.appendChild(el('span', '', d.rot));
    b.title = st[d.i].t;
    if (inativo) { b.disabled = true; g.appendChild(b); return; }
    b.onclick = e => {
      e.stopPropagation();
      const itens = [];
      if (d.tipo === 'arte') {
        itens.push(['Convidar a atualizar (WhatsApp)', () => abrirConvite(c.id)]);
        itens.push([feito ? 'Desfazer a troca deste mês' : 'Marcar anúncio trocado hoje', () => marcar(c.id, 'arte')]);
      } else if (d.tipo === 'exclusividade') {
        itens.push(['Marcar e avisar no WhatsApp', () => abrirExclusividade(c.id)]);
        if (feito) itens.push(['Desfazer a exclusividade do mês', () => marcar(c.id, 'exclusividade')]);
      } else {
        itens.push(['Cobrar com a chave pix (WhatsApp)', () => abrirCobranca(c.id)]);
        itens.push([feito ? 'Desfazer o pagamento do mês' : 'Registrar pagamento', () => marcar(c.id, 'pagamento')]);
      }
      itens.push(['Abrir cliente', () => abrirCliente(c.id)]);
      menu(b, itens, c.empresa + ' · ' + st[d.i].t);
    };
    g.appendChild(b);
  });
  return g;
}

function menu(ancora, itens, titulo) {
  document.querySelectorAll('.popover,.popbg').forEach(x => x.remove());
  const bg = el('div', 'popbg');
  const p = el('div', 'popover');
  if (titulo) p.appendChild(el('div', 'poptit', titulo));
  itens.forEach(([rot, fn]) => {
    const b = el('button', 'popbt', rot);
    b.onclick = () => { bg.remove(); p.remove(); fn(); };
    p.appendChild(b);
  });
  document.body.append(bg, p);
  const r = ancora.getBoundingClientRect();
  const larg = 250;
  p.style.width = larg + 'px';
  p.style.left = Math.max(8, Math.min(r.right - larg, window.innerWidth - larg - 8)) + 'px';
  const abaixo = r.bottom + 6;
  if (abaixo + p.offsetHeight > window.innerHeight - 8) p.style.top = Math.max(8, r.top - p.offsetHeight - 6) + 'px';
  else p.style.top = abaixo + 'px';
  bg.onclick = () => { bg.remove(); p.remove(); };
}

function marcadores(c) {
  const g = el('div', 'leds');
  const st = leds(c);
  [['arte', 'anúncio'], ['exclusividade', 'exclusividade'], ['pagamento', 'pagamento']].forEach(([tipo, nome], i) => {
    const b = el('button', 'pxbtn');
    b.appendChild(el('div', 'px ' + st[i].s));
    const bloqueado = eCortesia(c) || (tipo === 'pagamento' && !c.valor);
    b.title = st[i].t + (bloqueado ? '' : st[i].s === 'on' ? ' · clique para desfazer' : ` · clique para marcar ${nome}`);
    b.setAttribute('aria-label', st[i].t);
    if (bloqueado) b.disabled = true;
    else b.onclick = e => { e.stopPropagation(); marcar(c.id, tipo); };
    g.appendChild(b);
  });
  return g;
}

async function marcar(id, tipo) {
  const c = DB.clientes.find(x => x.id === id);
  const st = tipo === 'arte' ? statusArteMes(c) : tipo === 'exclusividade' ? statusExcMes(c) : statusPag(c);
  if (st.s === 'on') {                                   // desfazer o registro do mês
    const ev = DB.eventos.filter(e => e.cli === id && e.tipo === tipo &&
      (e.ref || e.data.slice(0, 7)) === mesRef).sort((a, b) => b.data.localeCompare(a.data))[0];
    if (!ev) return;
    if (!confirm(`Desfazer o registro de ${tipo === 'arte' ? 'troca de anúncio' : tipo} de ${c.empresa} em ${br(ev.data)}?`)) return;
    DB.eventos = DB.eventos.filter(e => e.id !== ev.id);
    recalc(id); await salvar(); render(); if (abertoId === id) abrirCliente(id);
    return;
  }
  const ev = { id: uid(), cli: id, tipo, data: hojeIso, nota: '' };
  if (tipo === 'pagamento') {
    modal(`Pagamento — ${c.empresa}`, [
      { id: 'valor', rot: 'Valor recebido (ref. ' + mesNome(mesRef) + ')', mask: 'moeda', valor: fmtMoedaEdit(c.valor) },
      { id: 'data', tipo: 'data', rot: 'Data em que o cliente pagou', valor: dataPadrao(mesRef) },
      { id: 'nota', rot: 'Observação (opcional)', valor: '' }
    ], async v => {
      DB.eventos.push({
        id: uid(), cli: id, tipo: 'pagamento', data: v.data || dataPadrao(mesRef), ref: mesRef,
        valor: desmascMoeda(v.valor), nota: v.nota.trim()
      });
      await salvar(); render(); if (abertoId === id) abrirCliente(id);
    }, 'Registrar');
    return;
  }
  if (tipo === 'exclusividade') { abrirExclusividade(id); return; }
  if (!confirm(`Marcar que o anúncio de ${c.empresa} foi trocado hoje (${br(hojeIso)})?`)) return;
  DB.eventos.push(ev); recalc(id); await salvar(); render(); if (abertoId === id) abrirCliente(id);
}

function telaAtrasados() {
  const tela = $('#tela');

  /* devedores que estão na base de clientes */
  const daBase = DB.clientes
    .map(c => ({ tipo: 'cliente', c, refs: refsEmAberto(c), avulsos: DB.atrasados.filter(a => a.cli === c.id && a.saldo > 0) }))
    .filter(x => x.refs.length || x.avulsos.length)
    .map(x => Object.assign(x, {
      nome: x.c.empresa, cidade: x.c.conta,
      total: x.refs.length * (x.c.valor || 0) + x.avulsos.reduce((s2, a) => s2 + a.saldo, 0),
      ultContato: x.c.ultContato
    }));

  /* dívidas antigas de quem não está mais na base */
  const avulsos = DB.atrasados.filter(a => a.saldo > 0 && !a.cli)
    .map(a => ({ tipo: 'avulso', a, nome: a.nome, cidade: a.cidade, total: a.saldo, ultContato: a.ultContato }));

  let lista = daBase.concat(avulsos).sort((x, y) => y.total - x.total);
  const totalGeral = lista.reduce((s2, x) => s2 + x.total, 0);
  const recebidosAtraso = recebimentosDoMes(mesRef).filter(x => x.atraso);
  const recMes = recebidosAtraso.reduce((s2, x) => s2 + x.valor, 0);

  tela.appendChild(kpis([
    ['Total em aberto', money(totalGeral), 'alert'],
    ['Devedores', lista.length, ''],
    ['Da base atual', daBase.length, daBase.length ? 'warn' : 'good'],
    ['Ex-clientes e avulsos', avulsos.length, ''],
    ['Recebido de atrasados em ' + mesNome(mesRef), money(recMes), 'good'],
  ]));

  tela.appendChild(bloco('Cobranças', lista.length + ' em aberto'));
  const fl = el('div', 'filters');
  [['OLINDINA', 'Olindina'], ['NOVA SOURE', 'Nova Soure'], ['base', 'Só da base atual'], ['avulso', 'Só ex-clientes']]
    .forEach(([f, rot]) => {
      const b = el('button', 'chip' + (filtro === f ? ' on' : ''), rot);
      b.onclick = () => { filtro = filtro === f ? null : f; render(); };
      fl.appendChild(b);
    });
  const nv = el('button', 'chip', '+ Dívida avulsa'); nv.onclick = novoAtrasado; fl.appendChild(nv);
  tela.appendChild(fl);

  if (filtro === 'OLINDINA' || filtro === 'NOVA SOURE') lista = lista.filter(x => x.cidade === filtro);
  else if (filtro === 'base') lista = lista.filter(x => x.tipo === 'cliente');
  else if (filtro === 'avulso') lista = lista.filter(x => x.tipo === 'avulso');

  const box = el('div', 'box');
  if (!lista.length) box.appendChild(el('div', 'empty', 'Ninguém em atraso com esse filtro.'));
  lista.forEach(x => {
    const r = el('div', 'row atr');
    const n = el('div', 'nome', x.nome);
    const partes = [cidadeNome(x.cidade)];
    if (x.tipo === 'cliente') {
      if (x.refs.length) partes.push(x.refs.length + ' ' + (x.refs.length === 1 ? 'mês' : 'meses') + ': ' + x.refs.map(mesNome).join(', '));
      const dv = x.avulsos.reduce((s2, a) => s2 + a.saldo, 0);
      if (dv) partes.push('dívida anterior ' + money(dv));
    } else {
      partes.push('fora da base');
      if (x.a.meses) partes.push(x.a.meses + ' meses');
      if (x.a.obs) partes.push(x.a.obs.slice(0, 40));
    }
    n.appendChild(el('small', '', partes.join(' · ')));
    r.appendChild(n);
    r.appendChild(el('div', 'cell r', money(x.total)));
    const acoes = el('div', 'acoes');
    if (x.tipo === 'cliente') {
      const z = el('button', 'mini zap', 'R$'); z.title = 'Cobrar pelo WhatsApp';
      z.onclick = e => { e.stopPropagation(); abrirCobranca(x.c.id); };
      acoes.appendChild(z);
      const rb = el('button', 'mini', '✓'); rb.title = 'Registrar recebimento';
      rb.onclick = e => { e.stopPropagation(); receberAtraso(x); };
      acoes.appendChild(rb);
      const db = el('button', 'mini', '⊘'); db.title = 'Baixar sem receber (ajuste)';
      db.onclick = e => { e.stopPropagation(); dispensarAtraso(x); };
      acoes.appendChild(db);
    } else {
      const vb = el('button', 'mini', '⇄'); vb.title = 'Vincular a um cliente da base';
      vb.onclick = e => { e.stopPropagation(); vincularAvulso(x.a); };
      acoes.appendChild(vb);
      const rb = el('button', 'mini', '✓'); rb.title = 'Registrar recebimento';
      rb.onclick = e => { e.stopPropagation(); abrirAtrasado(x.a.id); };
      acoes.appendChild(rb);
      const db = el('button', 'mini', '⊘'); db.title = 'Baixar sem receber (ajuste)';
      db.onclick = e => { e.stopPropagation(); dispensarAtraso(x); };
      acoes.appendChild(db);
    }
    r.appendChild(acoes);
    r.onclick = () => x.tipo === 'cliente' ? abrirCliente(x.c.id) : abrirAtrasado(x.a.id);
    box.appendChild(r);
  });
  tela.appendChild(box);
  const lg = el('div', 'legend');
  lg.innerHTML = '<span>Os meses em aberto são calculados sozinhos: mês sem pagamento lançado vira dívida aqui.</span>' +
    '<span>R$ cobrar no WhatsApp · ✓ registrar recebimento · ⊘ baixar sem receber · ⇄ vincular à base</span>';
  tela.appendChild(lg);

  /* o que já foi recebido de atrasados neste mês */
  tela.appendChild(bloco('Recebidos em ' + mesNome(mesRef), recebidosAtraso.length
    ? recebidosAtraso.length + ' quitações · ' + money(recMes) : 'nada recebido ainda'));
  const rb = el('div', 'box');
  if (!recebidosAtraso.length) rb.appendChild(el('div', 'empty', 'Quando você registrar um recebimento de atraso, ele aparece aqui.'));
  recebidosAtraso.forEach(x => {
    const r = el('div', 'row atr');
    const n = el('div', 'nome', x.nome);
    n.appendChild(el('small', '', [
      'recebido em ' + br(x.data),
      x.comp ? 'ref ' + mesNome(x.comp) : 'dívida anterior'
    ].join(' · ')));
    r.appendChild(n);
    r.appendChild(el('div', 'cell r', money(x.valor)));
    const ac = el('div', 'acoes');
    const ab = el('button', 'mini', '↗'); ab.title = 'Abrir';
    ab.onclick = e => { e.stopPropagation(); x.cli ? abrirCliente(x.cli) : abrirAtrasado(x.avulso); };
    ac.appendChild(ab); r.appendChild(ac);
    r.onclick = () => x.cli ? abrirCliente(x.cli) : abrirAtrasado(x.avulso);
    rb.appendChild(r);
  });
  tela.appendChild(rb);
  tela.appendChild(rodape());
}

function receberAtraso(x) {
  const opcoes = x.refs.map(r => [r, mesNome(r) + ' — ' + money(x.c.valor)]);
  x.avulsos.forEach(a => opcoes.push(['avulso:' + a.id, 'Dívida anterior — ' + money(a.saldo)]));
  if (!opcoes.length) return;
  modal(`Recebimento — ${x.c.empresa}`, [
    { id: 'alvo', tipo: 'select', rot: 'Referente a', valor: opcoes[0][0], opcoes },
    { id: 'valor', rot: 'Valor recebido', mask: 'moeda', valor: fmtMoedaEdit(x.refs.length ? x.c.valor : x.avulsos[0].saldo) },
    { id: 'data', tipo: 'data', rot: 'Data em que o cliente pagou', valor: hojeIso },
    { id: 'nota', rot: 'Observação (opcional)', valor: '' }
  ], async v => {
    const val = desmascMoeda(v.valor);
    const quando = v.data || hojeIso;
    if (String(v.alvo).startsWith('avulso:')) {
      const a = DB.atrasados.find(y => y.id === v.alvo.slice(7));
      a.recebidos = a.recebidos || [];
      a.recebidos.push({ id: uid(), data: quando, valor: val, nota: v.nota.trim() });
      a.saldo = Math.max(0, +(a.saldo - val).toFixed(2));
      a.ultContato = hojeIso;
    } else {
      DB.eventos.push({ id: uid(), cli: x.c.id, tipo: 'pagamento', data: quando, ref: v.alvo, valor: val, nota: v.nota.trim() });
    }
    await salvar(); render();
  }, 'Registrar');
}

/* tira da cobrança sem lançar dinheiro: acordo, erro de cadastro, dívida perdida */
function dispensarAtraso(x) {
  const opcoes = [];
  if (x.tipo === 'cliente') {
    x.refs.forEach(r => opcoes.push([r, mesNome(r) + ' — ' + money(x.c.valor)]));
    if (x.refs.length > 1) opcoes.unshift(['todos', 'Todos os ' + x.refs.length + ' meses em aberto']);
    x.avulsos.forEach(a => opcoes.push(['avulso:' + a.id, 'Dívida anterior — ' + money(a.saldo)]));
  } else {
    opcoes.push(['avulso:' + x.a.id, 'Dívida de ' + money(x.a.saldo)]);
  }
  if (!opcoes.length) return;
  modal(`Baixar sem receber — ${x.nome}`, [
    { id: 'alvo', tipo: 'select', rot: 'O que sai da cobrança', valor: opcoes[0][0], opcoes },
    { id: 'motivo', tipo: 'select', rot: 'Motivo', valor: 'Acordo comercial', opcoes: [

function vincularAvulso(a) {

function rodape() {

  const js = el('button', 'ghost', 'Baixar backup (JSON)'); js.onclick = () => baixar('carteira-led-' + hojeIso + '.json', JSON.stringify(DB, null, 1), 'application/json');
  const imp = el('button', 'ghost', 'Restaurar backup'); imp.onclick = () => $('#file').click();
  f.append(csv, js, imp);
  const aj = el('button', 'ghost', 'Ajustar datas de pagamento'); aj.onclick = ajustarDatas; f.appendChild(aj);
  if (usaSupabase()) {
    const tt = el('button', 'ghost', 'Testar conexão'); tt.onclick = testarConexao; f.appendChild(tt);
  }
  const inp = el('input'); inp.type = 'file'; inp.accept = '.json'; inp.id = 'file'; inp.style.display = 'none';
  inp.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = async () => {
      try { const d = JSON.parse(r.result); if (!d.clientes) throw 0; DB = d; normalizar(); await salvar(); render(); }
      catch (err) { alert('Esse arquivo não é um backup da carteira.'); }
    };
    r.readAsText(file);
  };
  f.appendChild(inp);
  return f;
}

function abrirSheet() { ligaMascaras($('#sheet')); $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('open'); }
function fechar() { $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('open'); abertoId = null; }

async function registrar(id, tipo) {
  if (tipo === 'pagamento' || tipo === 'exclusividade') return marcar(id, tipo);
  const c = DB.clientes.find(x => x.id === id);
  const rot = tipo === 'arte' ? 'Troca de anúncio' : 'Contato';
  modal(`${rot} — ${c.empresa}`, [
    { id: 'nota', rot: tipo === 'arte' ? 'Nota sobre o novo anúncio (opcional)' : 'Como foi a conversa? (opcional)', tipo: 'textarea', valor: '' }
  ], async v => {
    DB.eventos.push({ id: uid(), cli: id, tipo, data: hojeIso, nota: v.nota.trim() });
    recalc(id); await salvar(); render(); if (abertoId === id) abrirCliente(id);
  }, 'Registrar');
}
function parseData(s) {
  const m = String(s).trim().match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/);
  if (!m) return null;
  let [_, d, mo, y] = m; y = y ? (y.length === 2 ? '20' + y : y) : mesRef.slice(0, 4);
  const dt = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  return isNaN(new Date(dt + 'T12:00:00')) ? null : dt;
}
function recalc(id) {
  const c = DB.clientes.find(x => x.id === id);
  const ult = t => DB.eventos.filter(e => e.cli === id && e.tipo === t && e.data <= hojeIso).map(e => e.data).sort().pop() || null;
  c.ultAtualizacao = ult('arte'); c.ultContato = ult('contato');
}
async function salvarCadastro(id) {
  const c = DB.clientes.find(x => x.id === id);
  c.responsavel = padroniza($('#e_resp').value); c.telefone = $('#e_tel').value.trim();
  c.cod = $('#e_cod').value.trim(); c.conta = $('#e_conta').value; c.tipo = $('#e_tipo').value;
  c.valor = desmascMoeda($('#e_valor').value);
  c.diaVenc = parseInt(String($('#e_venc').value).replace(/\D/g, '')) || null;
  c.obs = $('#e_obs').value.trim();
  c.entrada = $('#e_entrada').value || c.entrada;
  await salvar(); render(); abrirCliente(id);
}

/* ---------------- painéis e chips ---------------- */
const LOCAL_NOME = { 'OLINDINA': 'Olindina', 'NOVA SOURE': 'Nova Soure', 'HOUSEFIT': 'House Fit', 'LED': 'Escritório LED+' };
const nomeLocal = l => LOCAL_NOME[l] || l;
const CICLO = 30;

function ultimaRecarga(ch) {
  return DB.recargas.filter(r => r.chip === ch.id).map(r => r.data).sort().pop() || ch.ultimaRecarga || null;
}
function statusChip(ch) {
  const u = ultimaRecarga(ch);
  if (!u) return { s: 'off', dias: null, t: 'sem recarga registrada', venceEm: null };
  const venceEm = iso(new Date(dParse(u).getTime() + CICLO * 864e5));
  const faltam = dias(hoje(), dParse(venceEm));
  if (faltam < 0) return { s: 'off', dias: faltam, venceEm, t: `vencido há ${-faltam} dias` };
  if (faltam <= 5) return { s: 'wait', dias: faltam, venceEm, t: faltam === 0 ? 'vence hoje' : `vence em ${faltam} dias` };
  return { s: 'on', dias: faltam, venceEm, t: `vence em ${faltam} dias` };
}

  const rbox = el('div', 'box');

      DB.recargas = DB.recargas.filter(y => y.id !== r.id);

    };
    l.appendChild(x); rbox.appendChild(l);
  });
  tela.appendChild(rbox);

function recarregar(id) {
  const ch = DB.chips.find(x => x.id === id);
  const ultima = DB.recargas.filter(r => r.chip === id).sort((a, b) => b.data.localeCompare(a.data))[0];
  const campos = [
    { id: 'data', tipo: 'data', rot: ch.plano === 'PRE' ? 'Data da recarga' : 'Data do pagamento', valor: hojeIso },
    { id: 'valor', rot: 'Valor', mask: 'moeda', valor: fmtMoedaEdit(ultima ? ultima.valor : ch.valorPadrao || 0) },
    { id: 'cidade', tipo: 'select', rot: 'Lançar na despesa de', valor: ch.cidadeDespesa || '',
      opcoes: [['OLINDINA', 'Olindina'], ['NOVA SOURE', 'Nova Soure'], ['', 'Não lançar como despesa']] },
    { id: 'nota', rot: 'Observação (opcional)', valor: '' }
  ];
  modal(`${ch.plano === 'PRE' ? 'Recarga' : 'Fatura'} — ${ch.painel}`, campos, async v => {
    const val = desmascMoeda(v.valor);
    const data = v.data || hojeIso;
    const rec = { id: uid(), chip: id, data, valor: val, nota: v.nota.trim() };
    ch.valorPadrao = val;
    ch.cidadeDespesa = v.cidade;
    if (v.cidade) {
      const dId = uid();
      DB.despesas.push({
        id: dId, cidade: v.cidade, ref: data.slice(0, 7), data,
        nome: (ch.plano === 'PRE' ? 'Recarga chip ' : 'Fatura chip ') + ch.painel, valor: val, chip: id
      });
      rec.desp = dId;
    }
    DB.recargas.push(rec);
    await salvar(); render(); if (abertoId === id) abrirChip(id);
  }, 'Registrar');
}

    ['Na lista', ps.length, ''],

  fm.append(nome, tel, bt); cx.appendChild(fm); tela.appendChild(cx);

  tela.appendChild(bloco('Prospecções', ps.length ? ps.length + ' na lista' : ''));
  const box = el('div', 'box');
  if (!ps.length) box.appendChild(el('div', 'empty', 'Ninguém na lista ainda. Cadastre acima quem você falou ou lembrou de falar.'));
  ps.forEach(p => {
    const r = el('div', 'row prosp');

      p.ultContato ? 'falou ' + br(p.ultContato) : 'anotado ' + br(p.data)].join(' · ')));
    r.appendChild(n);
    const acoes = el('div', 'acoes');
    const z = el('button', 'mini zap', '✆'); z.title = 'Abrir conversa no WhatsApp';
    z.onclick = async () => {
      const num = zapNum(p.telefone);

    };

    const x = el('button', 'mini', '✕'); x.title = 'Remover';

      if (!confirm('Remover ' + p.nome + ' da prospecção?')) return;
      DB.prospects = DB.prospects.filter(y => y.id !== p.id); await salvar(); render();
    };

  });
  tela.appendChild(box);
  tela.appendChild(rodape());
}

/* ---------------- exportar ---------------- */
function baixar(nome, texto, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], { type: tipo })); a.download = nome; a.click();
}
function expCsv() {
  let cab, linhas, nome;
  if (aba === 'ATRASADOS') {
    nome = 'atrasados-led';
    cab = ['NOME', 'CIDADE', 'ANUNCIO', 'MESES', 'TOTAL', 'SALDO', 'ULT_CONTATO', 'TRATATIVA'];
    linhas = DB.atrasados.map(a => [a.nome, cidadeNome(a.cidade), a.status, a.meses || '', a.total, a.saldo, a.ultContato || '', a.obs]);
  } else {
    nome = 'carteira-' + aba.toLowerCase().replace(' ', '-');
    cab = ['CIDADE', 'TIPO', 'EMPRESA', 'RESPONSAVEL', 'WHATSAPP', 'COD', 'VALOR', 'DIA_PAGTO', 'ULT_TROCA_ANUNCIO', 'ULT_EXCLUSIVIDADE', 'ULT_CONTATO', 'PAGO_MES', 'ATIVO', 'OBS'];
    linhas = daCidade().map(c => {
      const ex = excs(c)[0];
      return [cidadeNome(c.conta), c.tipo, c.empresa, c.responsavel, c.telefone, c.cod, c.valor, c.diaVenc || '',
      c.ultAtualizacao || '', ex ? ex.data : '', c.ultContato || '',
      eCortesia(c) ? 'cortesia' : (pagoNoMes(c) ? 'SIM' : 'NAO'), c.ativo ? 'SIM' : 'NAO', c.obs];
    });
  }
  const txt = [cab.join(';'), ...linhas.map(l => l.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';'))].join('\n');
  baixar(nome + '-' + hojeIso + '.csv', '\uFEFF' + txt, 'text/csv');
}

function ajustarDatas() {
  const mesAnterior = somaMes(mesHoje, -1);
  modal('Ajustar datas de pagamento', [
    { id: 'de', tipo: 'data', rot: 'Pagamentos lançados em', valor: hojeIso },
    { id: 'para', tipo: 'data', rot: 'Passam a valer como pagos em', valor: ultimoDiaDoMes(mesAnterior) }
  ], async v => {
    if (!v.de || !v.para) { alert('Informe as duas datas.'); return true; }
    const evs = DB.eventos.filter(e => e.tipo === 'pagamento' && e.data === v.de);
    const recs = [];
    DB.atrasados.forEach(a => (a.recebidos || []).forEach(r => { if (r.data === v.de) recs.push(r); }));
    const total = evs.reduce((s2, e) => s2 + (e.valor || 0), 0) + recs.reduce((s2, r) => s2 + r.valor, 0);
    const qtd = evs.length + recs.length;
    if (!qtd) { alert('Nenhum pagamento lançado em ' + br(v.de) + '.'); return true; }
    if (!confirm(`Mover ${qtd} pagamento(s), somando ${money(total)}, de ${br(v.de)} para ${br(v.para)}?\n\n` +
      `O mês de referência de cada um não muda — só o caixa.`)) return true;
    evs.forEach(e => e.data = v.para);
    recs.forEach(r => r.data = v.para);
    await salvar(); render();
    alert(qtd + ' pagamento(s) ajustado(s) para ' + br(v.para) + '.');
  }, 'Ajustar');
}

async function testarConexao() {
  const cab = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };
  const passos = [];
  try {
    const r1 = await fetch(`${SUPABASE_URL}/rest/v1/led_estado?select=id`, { headers: cab });
    const t1 = await r1.text();
    passos.push(`Leitura: ${r1.status} ${r1.ok ? 'ok' : t1.slice(0, 120)}`);
    if (r1.ok) passos.push(`Linhas visíveis: ${(JSON.parse(t1) || []).length}`);
    const r2 = await fetch(`${SUPABASE_URL}/rest/v1/led_estado?on_conflict=id`, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=representation' }, cab),
      body: JSON.stringify({ id: 1, dados: DB, atualizado_em: new Date().toISOString() })
    });
    const t2 = await r2.text();
    const j2 = r2.ok ? JSON.parse(t2 || '[]') : [];
    passos.push(`Gravação: ${r2.status} ${r2.ok ? (j2.length ? 'ok, linha gravada' : 'sem efeito — policy bloqueando') : t2.slice(0, 160)}`);
  } catch (e) {
    passos.push('Falha de rede: ' + e.message);
    passos.push('Se estiver abrindo a página dentro do Claude, o acesso externo é bloqueado. Teste na Vercel ou no navegador.');
  }
  alert(passos.join('\n\n'));
}
